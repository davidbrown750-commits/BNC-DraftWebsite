<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lobby Screen | Berkeley Nucleonics</title>
<style>
  /* One renderer for every lobby screen. A new screen is a new record in the
     dashboard, not a new file here: the kind decides the layout. Sizes are in vw/vh
     so the same page reads correctly on the reception TV and on a laptop. */
  :root{
    --blue:#0655a3; --ink:#113163; --deep:#08213f;
    --white:#ffffff; --soft:rgba(255,255,255,.78); --line:rgba(255,255,255,.22);
    --font-h:'Myriad Pro','Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif;
    --font-b:Arial,'Helvetica Neue',Helvetica,sans-serif;
    --r:4px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font-family:var(--font-b);color:var(--white);background:var(--ink)}

  /* Wallpaper sits behind everything, with a scrim so white text keeps its contrast
     whatever anyone uploads. Without the scrim a bright seasonal photo makes the
     board unreadable from across the room. */
  #bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;
    background-repeat:no-repeat}
  #scrim{position:fixed;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(8,33,63,.90),rgba(6,85,163,.82))}
  body.has-bg #scrim{background:linear-gradient(180deg,rgba(8,33,63,.78),rgba(8,33,63,.86))}

  .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
    padding:clamp(20px,2.6vh,40px) clamp(24px,3vw,64px)}

  header{display:flex;align-items:center;justify-content:space-between;gap:24px;flex:0 0 auto}
  header .logo{width:clamp(150px,13vw,248px);height:auto}
  header .clock{font-family:var(--font-h);font-size:clamp(15px,1.7vw,30px);font-weight:700;
    color:var(--soft);font-variant-numeric:tabular-nums;letter-spacing:.02em}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;
    padding:clamp(12px,2vh,32px) 0}
  h1{font-family:var(--font-h);font-weight:700;margin:0 0 clamp(14px,2.4vh,34px);
    font-size:clamp(30px,5vw,86px);line-height:1.05;letter-spacing:-.01em}
  .rule{width:clamp(56px,7vw,132px);height:5px;background:var(--white);opacity:.9;
    border-radius:var(--r);margin-bottom:clamp(16px,2.6vh,36px)}

  /* ---------- visitors ---------- */
  .guests{display:grid;gap:clamp(12px,1.6vh,24px)}
  .guest{display:grid;grid-template-columns:clamp(88px,9vw,150px) 1fr clamp(110px,12vw,210px);
    align-items:center;gap:clamp(14px,2vw,34px);
    background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:var(--r);
    padding:clamp(12px,1.7vh,26px) clamp(16px,2vw,32px);
    animation:rise .55s cubic-bezier(.2,.9,.3,1) both}
  .guest .t{font-family:var(--font-h);font-size:clamp(17px,2.1vw,38px);font-weight:700;
    color:var(--white);font-variant-numeric:tabular-nums;white-space:nowrap}
  .guest .who .n{font-family:var(--font-h);font-size:clamp(20px,2.6vw,46px);font-weight:700;
    line-height:1.12;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .guest .who .c{font-size:clamp(14px,1.5vw,26px);color:var(--soft);margin-top:.18em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Guest logos sit on a white tile: most company marks are drawn for light grounds
     and disappear straight into a navy panel. */
  .guest .mark{display:flex;align-items:center;justify-content:center;
    height:clamp(52px,6.4vh,104px);background:var(--white);border-radius:var(--r);
    padding:clamp(6px,.9vh,14px)}
  .guest .mark img{max-width:100%;max-height:100%;object-fit:contain}
  .guest .mark.empty{background:transparent}

  /* ---------- did you know ---------- */
  .dyk{display:grid;grid-template-columns:1fr;gap:clamp(18px,3vw,48px);align-items:center;min-height:0}
  .dyk.with-art{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
  .dyk .copy{font-size:clamp(21px,2.7vw,50px);line-height:1.34;white-space:pre-wrap;
    overflow-wrap:anywhere}
  .art{display:grid;gap:clamp(10px,1.6vh,22px)}
  .art img{width:100%;max-height:34vh;object-fit:cover;border-radius:var(--r);
    border:1px solid var(--line);background:rgba(255,255,255,.08);
    animation:pop .7s cubic-bezier(.2,1.3,.4,1) both}
  .art img:nth-child(2){animation-delay:.22s}
  .art img:nth-child(3){animation-delay:.44s}
  .art img:nth-child(4){animation-delay:.66s}

  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .guest:nth-child(2){animation-delay:.09s}
  .guest:nth-child(3){animation-delay:.18s}
  .guest:nth-child(4){animation-delay:.27s}

  footer{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:16px;border-top:1px solid var(--line);padding-top:clamp(10px,1.5vh,20px);
    font-size:clamp(11px,1.05vw,18px);color:var(--soft);letter-spacing:.04em}

  .notice{font-family:var(--font-h);font-size:clamp(18px,2.2vw,38px);color:var(--soft);
    text-align:center;line-height:1.4}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="scrim"></div>

<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 972.3 485.93" role="img" aria-label="Berkeley Nucleonics">
      <g fill="#ffffff">
        <path d="M326.86,400.29c-88.04,0-159.67-71.63-159.67-159.67s71.63-159.67,159.67-159.67,159.67,71.63,159.67,159.67-71.63,159.67-159.67,159.67ZM326.86,99.21c-77.97,0-141.4,63.43-141.4,141.41s63.43,141.4,141.4,141.4,141.4-63.43,141.4-141.4-63.43-141.41-141.4-141.41Z"/>
        <polygon points="882.15 284.93 383 284.93 383 204.02 268.17 204.02 268.17 284.93 90.53 284.93 90.53 274.49 257.73 274.49 257.73 193.58 393.44 193.58 393.44 274.49 882.15 274.49 882.15 284.93"/>
        <path d="M540.98,231.52l6.4-30.06h18.94c11.43,0,18.83,2.03,16.06,15.03-2.77,13-11.02,15.03-22.46,15.03h-18.95ZM551.37,182.66l5.66-26.62h18.94c10.18,0,14.92,4.23,12.99,13.31-1.93,9.08-8.47,13.31-18.64,13.31h-18.95ZM555.47,250.31c17.11,1.25,47.03-6.89,51.79-29.29,3.53-16.6-5.02-26.46-18.64-29.44l.07-.31c12.07-3.76,22.52-12.37,25.15-24.74,4.69-22.08-14.18-30.53-34.64-29.28h-42.43l-24.03,113.06h42.75Z"/>
        <polygon points="720.52 250.31 744.56 137.25 721.85 137.25 703.01 225.88 702.63 226.19 678.48 137.25 642.46 137.25 618.43 250.31 641.13 250.31 661.04 156.67 661.42 156.35 686.07 250.31 720.52 250.31"/>
        <path d="M847.93,173.89c4.93-28.34-13.17-38.99-39.16-38.99-32.73,0-52.94,25.84-59.96,58.87-7.02,33.04,2.2,58.88,34.93,58.88,25.99,0,48.61-10.65,55.74-38.99h-25.84c-2.37,11.9-11.61,21.45-26.17,21.45-17.23,0-16.18-25.52-12.82-41.34,3.36-15.81,13.18-41.34,30.4-41.34,14.56,0,19.73,9.55,17.05,21.45h25.84Z"/>
      </g>
    </svg>
    <div class="clock" id="clock"></div>
  </header>

  <main id="stage">
    <div class="notice" id="notice">Loading…</div>
  </main>

  <footer>
    <span>Berkeley Nucleonics Corporation</span>
    <span id="stamp"></span>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var POLL_MS = 30000;

  function screenId(){
    var m = /[?&]id=([A-Za-z0-9-]{1,49})/.exec(location.search);
    return m ? m[1].toLowerCase() : "";
  }
  function el(tag, cls){ var n=document.createElement(tag); if(cls)n.className=cls; return n; }
  // Every value below is staff free text. It is written with textContent, never
  // innerHTML, so a stray angle bracket stays a character and cannot become markup.
  function txt(node, s){ node.textContent = (s == null ? "" : String(s)); return node; }

  function tick(){
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    document.getElementById("clock").textContent =
      h + ":" + (m < 10 ? "0" : "") + m + " " + ampm;
  }

  function setBackground(url){
    var bg = document.getElementById("bg");
    if (url) { bg.style.backgroundImage = 'url("' + url.replace(/"/g, "%22") + '")';
               document.body.classList.add("has-bg"); }
    else { bg.style.backgroundImage = ""; document.body.classList.remove("has-bg"); }
  }

  function renderVisitor(stage, s){
    var h1 = txt(el("h1"), s.heading || "Welcome");
    stage.appendChild(h1);
    stage.appendChild(el("div","rule"));
    var list = el("div","guests");
    (s.visitors || []).forEach(function(v){
      var row = el("div","guest");
      row.appendChild(txt(el("div","t"), v.time || ""));
      var who = el("div","who");
      who.appendChild(txt(el("div","n"), v.name || ""));
      who.appendChild(txt(el("div","c"), v.company || ""));
      row.appendChild(who);
      var mark = el("div","mark");
      if (v.logo) { var img = el("img"); img.src = v.logo; img.alt = v.company || ""; mark.appendChild(img); }
      else { mark.className = "mark empty"; }
      row.appendChild(mark);
      list.appendChild(row);
    });
    stage.appendChild(list);
  }

  function renderDidYouKnow(stage, s){
    var h1 = txt(el("h1"), s.heading || "Did You Know?");
    stage.appendChild(h1);
    stage.appendChild(el("div","rule"));
    var imgs = (s.images || []).filter(Boolean);
    var grid = el("div","dyk" + (imgs.length ? " with-art" : ""));
    grid.appendChild(txt(el("div","copy"), s.body || ""));
    if (imgs.length){
      var art = el("div","art");
      imgs.forEach(function(u){ var i = el("img"); i.src = u; i.alt = ""; art.appendChild(i); });
      grid.appendChild(art);
    }
    stage.appendChild(grid);
  }

  function notice(stage, msg){
    stage.appendChild(txt(el("div","notice"), msg));
  }

  var lastStamp = "";
  function render(s){
    // Skip a repaint when nothing changed, so the entry animations do not replay
    // every thirty seconds in front of whoever is standing there.
    if (s && s.updated_at && s.updated_at === lastStamp) return;
    lastStamp = (s && s.updated_at) || "";
    var stage = document.getElementById("stage");
    stage.innerHTML = "";
    if (!s) { notice(stage, "This screen has not been set up yet."); setBackground(""); return; }
    if (s.enabled === false) { notice(stage, "This screen is turned off."); setBackground(s.background); return; }
    setBackground(s.background);
    if (s.kind === "visitor") renderVisitor(stage, s); else renderDidYouKnow(stage, s);
    document.title = (s.title || "Lobby Screen") + " | Berkeley Nucleonics";
    var st = document.getElementById("stamp");
    st.textContent = s.updated_by ? ("Updated by " + s.updated_by) : "";
  }

  function load(){
    var id = screenId();
    if (!id){ render(null); return; }
    fetch("/api/lobby-screens?id=" + encodeURIComponent(id) + location.search.replace(/^\?/, "&"),
          { cache: "no-store", credentials: "same-origin" })
      .then(function(r){
        if (r.status === 401){ location.replace("/lobby-signin.html?next=" +
          encodeURIComponent(location.pathname + location.search)); return null; }
        return r.json();
      })
      .then(function(j){ if (j) render(j.ok ? j.screen : null); })
      .catch(function(){ /* keep showing whatever is up; a wall screen must not go blank */ });
  }

  tick(); setInterval(tick, 10000);
  load(); setInterval(load, POLL_MS);
})();
</script>
</body>
</html>
