<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" width="1300" height="620" role="img" aria-label="ICX-Series USB and ICX-FieldHawk-N spectrum analyzer family by performance tier and maximum frequency">
 <style>
  .lbl{font-family:"Myriad Pro",Arial,Helvetica,sans-serif;fill:#113163}
  .mdl{font-family:"Myriad Pro",Arial,Helvetica,sans-serif;font-size:16px;fill:#113163}
  .tier{font-family:"Myriad Pro",Arial,Helvetica,sans-serif;font-size:17px;fill:#113163}
  .freq{font-family:"Myriad Pro",Arial,Helvetica,sans-serif;font-size:17px;fill:#113163}
  .ttl{font-family:"Myriad Pro",Arial,Helvetica,sans-serif;font-size:20px;fill:#113163}
  .usb{fill:#dcf0d6;stroke:#4a8c3f;stroke-width:1.5}
  .eth{fill:#d8e7f6;stroke:#0655a3;stroke-width:1.5}
 </style>
 <rect width="1300" height="620" fill="#ffffff"/>

 <!-- legend -->
 <rect class="usb" x="230" y="22" width="150" height="44" rx="7"/>
 <text class="mdl" x="305" y="43" text-anchor="middle">USB</text>
 <text class="mdl" x="305" y="60" text-anchor="middle">Interface</text>
 <rect class="eth" x="398" y="22" width="150" height="44" rx="7"/>
 <text class="mdl" x="473" y="43" text-anchor="middle">Ethernet</text>
 <text class="mdl" x="473" y="60" text-anchor="middle">Interface</text>

 <!-- axes -->
 <line x1="60" y1="20" x2="60" y2="520" stroke="#113163" stroke-width="2"/>
 <polygon points="60,12 55,24 65,24" fill="#113163"/>
 <line x1="60" y1="520" x2="1272" y2="520" stroke="#113163" stroke-width="2"/>
 <polygon points="1280,520 1268,515 1268,525" fill="#113163"/>

 <!-- tier divider -->
 <line x1="60" y1="290" x2="1265" y2="290" stroke="#113163" stroke-width="1.6" stroke-dasharray="12 8"/>

 <!-- tier labels -->
 <text class="tier" x="72" y="178">Performance++</text>
 <text class="tier" x="72" y="314">Economy model</text>

 <!-- Performance++ : 9.5 GHz -->
 <rect class="eth" x="715" y="170" width="150" height="40" rx="7"/>
 <text class="mdl" x="790" y="196" text-anchor="middle">ICX-090N</text>
 <rect class="usb" x="715" y="215" width="150" height="40" rx="7"/>
 <text class="mdl" x="790" y="241" text-anchor="middle">ICX-090U</text>

 <!-- Performance++ : 20 GHz -->
 <rect class="eth" x="895" y="170" width="150" height="40" rx="7"/>
 <text class="mdl" x="970" y="196" text-anchor="middle">ICX-200N</text>
 <rect class="usb" x="895" y="215" width="150" height="40" rx="7"/>
 <text class="mdl" x="970" y="241" text-anchor="middle">ICX-200U</text>

 <!-- Economy : 4.5 GHz -->
 <rect class="eth" x="175" y="325" width="150" height="40" rx="7"/>
 <text class="mdl" x="250" y="351" text-anchor="middle">ICX-045N</text>
 <rect class="usb" x="175" y="370" width="150" height="40" rx="7"/>
 <text class="mdl" x="250" y="396" text-anchor="middle">ICX-045U</text>

 <!-- Economy : 6.3 GHz -->
 <rect class="eth" x="355" y="325" width="150" height="40" rx="7"/>
 <text class="mdl" x="430" y="351" text-anchor="middle">ICX-060N</text>
 <rect class="usb" x="355" y="370" width="150" height="40" rx="7"/>
 <text class="mdl" x="430" y="396" text-anchor="middle">ICX-060U</text>

 <!-- Economy : 40 GHz -->
 <rect class="eth" x="1075" y="325" width="150" height="40" rx="7"/>
 <text class="mdl" x="1150" y="351" text-anchor="middle">ICX-400N</text>
 <rect class="usb" x="1075" y="370" width="150" height="40" rx="7"/>
 <text class="mdl" x="1150" y="396" text-anchor="middle">ICX-400U</text>

 <!-- frequency axis labels -->
 <text class="freq" x="250"  y="552" text-anchor="middle">4.5 GHz</text>
 <text class="freq" x="430"  y="552" text-anchor="middle">6.3 GHz</text>
 <text class="freq" x="790"  y="552" text-anchor="middle">9.5 GHz</text>
 <text class="freq" x="970"  y="552" text-anchor="middle">20 GHz</text>
 <text class="freq" x="1150" y="552" text-anchor="middle">40 GHz</text>

 <text class="ttl" x="650" y="596" text-anchor="middle">ICX-Series USB and ICX-FieldHawk-N Spectrum Analyzer Family</text>
</svg>
