<h1>Chapter 8 Quiz</h1>
<p class="lead">Pick one answer per question, then check your score. Your answers are saved on this device, so you can come back to them.</p>

<div id="bnc-quiz"></div>

<script>
window.QUIZ_DATA = {
  bookKey: "rtsa",
  chapterKey: "08",
  title: "Chapter 8 Quiz",
  questions: [
    {
      q: "When the fundamental driving a nonlinear device rises by 1 dB, the second harmonic rises by:",
      options: [
        "1 dB",
        "2 dB",
        "3 dB",
        "6 dB"
      ],
      answer: 1,
      explain: "The second harmonic is proportional to the square of the input voltage, so it rises 2 dB for every 1 dB of fundamental increase."
    },
    {
      q: "A harmonic level expressed in dBc is measured relative to:",
      options: [
        "The analyzer's noise floor",
        "1 milliwatt",
        "The fundamental (carrier) power",
        "The analyzer's reference level"
      ],
      answer: 2,
      explain: "dBc means decibels relative to the carrier: harmonic power in dBm minus fundamental power in dBm."
    },
    {
      q: "To measure the third harmonic of a 13.5 GHz Ku-band transmitter, the analyzer must tune to:",
      options: [
        "27 GHz",
        "40.5 GHz",
        "13.5 GHz",
        "30 GHz"
      ],
      answer: 1,
      explain: "The nth harmonic sits at n times the fundamental, so the third harmonic of 13.5 GHz is at 40.5 GHz."
    },
    {
      q: "An analyzer with a second harmonic intercept (SHI) of +45 dBm running at a mixer level of -20 dBm generates an internal second harmonic of:",
      options: [
        "-25 dBc",
        "-45 dBc",
        "-65 dBc",
        "-90 dBc"
      ],
      answer: 2,
      explain: "Internal second harmonic in dBc is -(SHI - mixer level) = -(45 - (-20)) = -65 dBc."
    },
    {
      q: "You add 10 dB of input attenuation and the displayed harmonic level drops. This means:",
      options: [
        "The device's harmonic is confirmed as real",
        "The analyzer was generating part of the displayed harmonic",
        "The resolution bandwidth is set too wide",
        "The fundamental has gone into compression"
      ],
      answer: 1,
      explain: "A true device harmonic is re-corrected along with the fundamental and does not move; a reading that drops with added attenuation was partly the analyzer's own distortion."
    },
    {
      q: "The optimum mixer level for a distortion measurement is the point where:",
      options: [
        "Internal distortion products equal the displayed noise floor",
        "The mixer receives its maximum rated power",
        "The reference level equals the fundamental power",
        "The input attenuation is zero"
      ],
      answer: 0,
      explain: "Lowering mixer level reduces distortion but raises the noise floor, so the widest distortion measurement range sits where the two are equal."
    },
    {
      q: "A tracking generator is best described as:",
      options: [
        "A free-running signal source set to a fixed frequency",
        "A signal source phase-locked to the analyzer sweep, always outputting the frequency the analyzer is tuned to",
        "A calibrated broadband noise source",
        "A pulse generator triggered by the analyzer's display update"
      ],
      answer: 1,
      explain: "A tracking generator tracks the analyzer's sweep, outputting a sine at exactly the analyzer's tuned frequency at every instant."
    },
    {
      q: "Normalization in a tracking generator measurement:",
      options: [
        "Applies full vector error correction including mismatch",
        "Stores a through-connection trace as a reference and subtracts it to remove cable loss and TG flatness ripple",
        "Increases the measurement's dynamic range beyond the noise floor",
        "Calibrates the analyzer's frequency axis against an atomic standard"
      ],
      answer: 1,
      explain: "Normalization stores the through path as the 0 dB reference and subtracts it, removing frequency-response error but not mismatch error."
    },
    {
      q: "Which measurement is beyond a scalar analyzer-plus-TG setup and requires a vector network analyzer?",
      options: [
        "Cable insertion loss versus frequency",
        "Filter stopband rejection",
        "Group delay through a filter",
        "Amplifier gain flatness"
      ],
      answer: 2,
      explain: "Group delay is derived from phase versus frequency, and a scalar setup measures magnitude only."
    },
    {
      q: "Measuring each harmonic individually in dBc is more diagnostic than a single THD number because:",
      options: [
        "It is faster to compute",
        "The dominant harmonic identifies the mechanism: strong 2nd suggests asymmetry or bias error, strong 3rd suggests symmetric compression",
        "THD can only be measured with a vector network analyzer",
        "THD is defined only for audio frequencies"
      ],
      answer: 1,
      explain: "Two devices with the same THD can fail differently; which harmonic dominates points to the underlying nonlinearity."
    }
  ]
};
</script>
