<!-- START BNC consent mode -->
<script data-cookieconsent="ignore">
/* Google Consent Mode v2 defaults. Must run before Cookiebot and before the GTM container.

   Everything is denied until the visitor agrees — nothing is stored and no ad identifier is
   sent before then. Declaring the defaults is what lets the container load for everyone
   without loading anything *into* storage: Google gets a "denied" signal it can model
   against, instead of the silence it used to get from anyone who declined the banner.

   url_passthrough keeps the gclid on internal navigation while ad_storage is denied, which
   is what preserves attribution for a non-consenting click. ads_data_redaction strips ad
   identifiers from those denied-state pings. */
(function (w) {
  w.dataLayer = w.dataLayer || [];
  function gtag() { w.dataLayer.push(arguments); }
  w.gtag = w.gtag || gtag;

  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied',
    functionality_storage: 'denied',
    personalization_storage: 'denied',
    security_storage: 'granted',
    wait_for_update: 500
  });
  gtag('set', 'ads_data_redaction', true);
  gtag('set', 'url_passthrough', true);

  /* Bridge Cookiebot's answer into Consent Mode. Cookiebot's built-in integration has to be
     enabled in the Cookiebot admin; this works whether or not it is, and running both is
     harmless because consent updates are last-write-wins with identical values. */
  function update() {
    var c = w.Cookiebot && w.Cookiebot.consent;
    if (!c) return;
    gtag('consent', 'update', {
      ad_storage: c.marketing ? 'granted' : 'denied',
      ad_user_data: c.marketing ? 'granted' : 'denied',
      ad_personalization: c.marketing ? 'granted' : 'denied',
      analytics_storage: c.statistics ? 'granted' : 'denied',
      functionality_storage: c.preferences ? 'granted' : 'denied',
      personalization_storage: c.preferences ? 'granted' : 'denied'
    });
  }
  w.addEventListener('CookiebotOnAccept', update);
  w.addEventListener('CookiebotOnDecline', update);
  w.addEventListener('CookiebotOnConsentReady', update);
})(window);
</script>
<!-- END BNC consent mode -->
<!-- START Cookiebot -->
<script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="3e6dc43b-2534-4053-870c-9024a88cb3a8" data-blockingmode="manual" type="text/javascript"></script>
<!-- END Cookiebot -->
<!-- START BNC attribution -->
<script data-cookieconsent="ignore">
/* Paid-click attribution. Runs before the GTM container so `dataLayer` exists for every
   page, and so a gclid is captured on the landing page even if the visitor converts three
   pages later. `window.BNC_ATTR` is what the forms read on submit.

   Storage is tiered on purpose. sessionStorage is always written, so an ad click that
   converts in the same visit is attributable regardless of the cookie banner. The 90-day
   first-party cookie — the only part that tracks across visits — is written only once
   Cookiebot reports marketing consent. */
(function (w, d) {
  w.dataLayer = w.dataLayer || [];
  var KEYS = ['gclid', 'wbraid', 'gbraid', 'msclkid',
              'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
  var CLICK_IDS = ['gclid', 'wbraid', 'gbraid', 'msclkid'];
  var NAME = 'bnc_attr', MAX_AGE = 7776000; /* 90 days */

  function readCookie() {
    try {
      var m = d.cookie.match(/(?:^|;\s*)bnc_attr=([^;]*)/);
      return m ? JSON.parse(decodeURIComponent(m[1])) : null;
    } catch (e) { return null; }
  }
  function writeCookie(o) {
    try {
      d.cookie = NAME + '=' + encodeURIComponent(JSON.stringify(o)) + ';path=/;max-age=' +
        MAX_AGE + ';samesite=lax' + (location.protocol === 'https:' ? ';secure' : '');
    } catch (e) {}
  }
  function readSession() {
    try { return JSON.parse(sessionStorage.getItem(NAME) || 'null'); } catch (e) { return null; }
  }
  function writeSession(o) {
    try { sessionStorage.setItem(NAME, JSON.stringify(o)); } catch (e) {}
  }
  function marketingOk() {
    try { return !!(w.Cookiebot && w.Cookiebot.consent && w.Cookiebot.consent.marketing); }
    catch (e) { return false; }
  }

  var q, fresh = {}, hasFresh = false, hasClickId = false;
  try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
  if (q) {
    for (var i = 0; i < KEYS.length; i++) {
      var v = q.get(KEYS[i]);
      if (v) {
        fresh[KEYS[i]] = String(v).slice(0, 200);
        hasFresh = true;
        if (CLICK_IDS.indexOf(KEYS[i]) !== -1) hasClickId = true;
      }
    }
  }

  var attr = readSession() || readCookie();
  /* A new click id always wins — it is a fresh paid visit. Campaign params without a click
     id only fill in when nothing is stored yet, so an internal link carrying stale UTMs
     cannot overwrite the real acquisition source. */
  if (hasFresh && (hasClickId || !attr)) {
    fresh.landing_page = String(location.pathname).slice(0, 300);
    fresh.first_seen = new Date().toISOString();
    attr = fresh;
    writeSession(attr);
    if (marketingOk()) writeCookie(attr);
  }
  w.BNC_ATTR = attr || {};

  /* Cookiebot resolves after this script. Promote to the cross-visit cookie once, if and
     when marketing consent lands. */
  function promote() { if (w.BNC_ATTR && w.BNC_ATTR.first_seen && marketingOk()) writeCookie(w.BNC_ATTR); }
  w.addEventListener('CookiebotOnAccept', promote);
  w.addEventListener('CookiebotOnConsentReady', promote);

  /* Native (non-fetch) forms post straight to /api/form, so the values have to ride along
     as hidden inputs. Fetch-based forms read window.BNC_ATTR directly instead. */
  function stamp() {
    if (!w.BNC_ATTR || !w.BNC_ATTR.first_seen) return;
    var forms = d.getElementsByTagName('form');
    for (var i = 0; i < forms.length; i++) {
      var f = forms[i];
      if (f.getAttribute('data-bnc-attr') === '1') continue;
      if (!/\/api\/form/.test(f.getAttribute('action') || '')) continue;
      f.setAttribute('data-bnc-attr', '1');
      for (var k in w.BNC_ATTR) {
        if (!Object.prototype.hasOwnProperty.call(w.BNC_ATTR, k)) continue;
        var el = d.createElement('input');
        el.type = 'hidden'; el.name = k; el.value = w.BNC_ATTR[k];
        f.appendChild(el);
      }
    }
  }
  if (d.readyState === 'loading') d.addEventListener('DOMContentLoaded', stamp);
  else stamp();

  /* Conversion event for forms that never navigate. The forms that post natively land on
     thank-you.html, which fires this for them. The fetch-based ones — QuickQuote, the
     datasheet PDF configurator, the line-card quote, the book resource forms and quizzes —
     stay on the page and show an inline success, so they have to fire it themselves.
     Between them they cover most of the site's form volume and none of it was measurable.
     Call once, on confirmed success only. */
  w.bncTrackFormSubmit = function (formType) {
    try {
      var ev = { event: 'form_submission_complete', form_type: String(formType || 'contact') };
      var a = w.BNC_ATTR || {};
      if (a.gclid) ev.gclid = a.gclid;
      if (a.utm_source) ev.utm_source = a.utm_source;
      if (a.utm_campaign) ev.utm_campaign = a.utm_campaign;
      w.dataLayer.push(ev);
    } catch (e) {}
  };

  /* A form carrying `_next` sends the visitor back where they came from instead of to
     thank-you.html — the ScintIQ configurator does this — so the conversion has to travel
     with them. /api/form appends `bnc_fs=<form type>` to that redirect and this fires it on
     arrival. The param is then stripped from the address bar so a refresh or a shared link
     cannot count a second time. */
  if (q) {
    var fs = q.get('bnc_fs');
    if (fs) {
      w.bncTrackFormSubmit(String(fs).toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 32));
      try {
        q.delete('bnc_fs');
        var rest = q.toString();
        history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
      } catch (e) {}
    }
  }
})(window, document);
</script>
<!-- END BNC attribution -->

<h1>Chapter 7 Quiz</h1>
<p class="lead">Pick one answer per question, then check your score. Your answers are saved on this device, so you can come back to them.</p>

<div id="bnc-quiz"></div>

<script>
window.QUIZ_DATA = {
  bookKey: "rtsa",
  chapterKey: "07",
  title: "Chapter 7 Quiz",
  questions: [
    {
      q: "Single-sideband phase noise L(f), expressed in dBc/Hz, is the ratio of:",
      options: [
        "Total sideband power to total noise power",
        "Carrier power to the analyzer noise floor",
        "Noise power in a 1 Hz bandwidth at offset f to the total carrier power",
        "Peak carrier power to average carrier power"
      ],
      answer: 2,
      explain: "L(f) compares the noise power in a 1 Hz bandwidth at a given offset to the total carrier power, in dB relative to the carrier per hertz."
    },
    {
      q: "A sideband marker reads -80 dBm in a 1 kHz RBW and the carrier reads 0 dBm. Ignoring detector corrections, the phase noise at that offset is approximately:",
      options: [
        "-80 dBc/Hz",
        "-110 dBc/Hz",
        "-50 dBc/Hz",
        "-83 dBc/Hz"
      ],
      answer: 1,
      explain: "Normalizing a 1 kHz RBW to 1 Hz subtracts 10 log10(1000) = 30 dB, so -80 dBc becomes -110 dBc/Hz."
    },
    {
      q: "If the device under test has exactly the same phase noise as the analyzer's own floor, the displayed level:",
      options: [
        "Reads about 3 dB higher than the true device noise",
        "Reads about 3 dB lower than the true device noise",
        "Is unaffected, because the analyzer subtracts its own noise",
        "Reads about 10 dB higher than the true device noise"
      ],
      answer: 0,
      explain: "Two equal, uncorrelated noise powers add, so the display reads 3 dB above the device's true level."
    },
    {
      q: "In the Leeson model, a region of the phase noise curve falling at -20 dB/decade corresponds to:",
      options: [
        "White phase noise",
        "Flicker phase noise",
        "White FM noise",
        "Random-walk FM noise"
      ],
      answer: 2,
      explain: "The 1/f-squared region, falling 20 dB per decade, is produced by white FM noise from thermal noise inside the oscillator loop."
    },
    {
      q: "Beyond automating decade sweeps and corrections, a dedicated phase noise mode improves the measurement floor mainly by:",
      options: [
        "Adding a second cross-correlation receiver chain",
        "Increasing the RF attenuation",
        "Using a wider resolution bandwidth",
        "Reconfiguring the receiver for spectral purity instead of tuning agility"
      ],
      answer: 3,
      explain: "Locked on a known carrier, the mode trades tuning speed and gain agility for quieter synthesizer settings and a purer signal path, the same hardware reconfigured."
    },
    {
      q: "With the device under test 10 dB above the analyzer's phase noise floor, the instrument contributes an error of about:",
      options: [
        "3 dB",
        "0.4 dB",
        "10 dB",
        "1.8 dB"
      ],
      answer: 1,
      explain: "At 10 dB of margin the floor adds 10 log10(1 + 0.1), about 0.4 dB, which is the basis of the 10 dB margin rule."
    },
    {
      q: "A sampling clock with 1 ps RMS jitter digitizes a 100 MHz input. The jitter-limited SNR is approximately:",
      options: [
        "44 dB",
        "84 dB",
        "64 dB",
        "100 dB"
      ],
      answer: 2,
      explain: "SNR = -20 log10(2 pi x 100 MHz x 1 ps) = -20 log10(6.28e-4), which is about 64 dB."
    },
    {
      q: "A cross-correlation phase noise analyzer running 100 correlation averages lowers its own noise contribution by about:",
      options: [
        "10 dB",
        "20 dB",
        "5 dB",
        "3 dB"
      ],
      answer: 0,
      explain: "Cross-correlation gain is 5 log10(N), so N = 100 averages buys 10 dB of floor improvement."
    },
    {
      q: "Multiplying a 100 MHz reference up to 1 GHz (a factor of 10) changes its phase noise curve by:",
      options: [
        "Nothing, multiplication does not affect phase",
        "Lowering it by 10 dB",
        "Raising it by 10 dB",
        "Raising it by 20 dB"
      ],
      answer: 3,
      explain: "Frequency multiplication by N raises phase noise by 20 log10(N), so a factor of 10 adds 20 dB."
    },
    {
      q: "A classic analyzer that log-averages Gaussian noise with a sample detector, without correction, will:",
      options: [
        "Over-read the noise by about 2.5 dB",
        "Under-read the noise by about 2.5 dB",
        "Read the noise exactly",
        "Under-read the noise by about 10 dB"
      ],
      answer: 1,
      explain: "Averaging the logarithm of a Gaussian noise envelope biases the result low by about 2.5 dB; RMS detection avoids the bias."
    }
  ]
};
