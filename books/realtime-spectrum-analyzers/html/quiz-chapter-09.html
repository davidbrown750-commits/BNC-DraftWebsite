<h1>Chapter 9 Quiz</h1>
<p class="lead">Pick one answer per question, then check your score. Your answers are saved on this device, so you can come back to them.</p>

<div id="bnc-quiz"></div>

<script>
window.QUIZ_DATA = {
  bookKey: "rtsa",
  chapterKey: "09",
  title: "Chapter 9 Quiz",
  questions: [
    {
      q: "In a software-defined radio, the hardware's essential job is to:",
      options: [
        "Demodulate FM broadcasts",
        "Translate a slice of spectrum to baseband and digitize it faithfully as I/Q samples",
        "Decode protocol frames into bits",
        "Draw the waterfall display"
      ],
      answer: 1,
      explain: "In an SDR the hardware only captures and digitizes I/Q; everything the radio does with those samples is defined in software."
    },
    {
      q: "SDR++'s modular architecture separates its plugins into which four roles?",
      options: [
        "Filters, mixers, amplifiers, antennas",
        "Inputs, outputs, buffers, threads",
        "Sources, DSP, decoders, sinks",
        "Drivers, kernels, shaders, codecs"
      ],
      answer: 2,
      explain: "SDR++ organizes its modules as sources that produce I/Q, DSP in the middle, decoders that extract meaning, and sinks that deliver results."
    },
    {
      q: "Compared with an RTL-SDR waterfall, the amplitude axis of an RTSA's display is:",
      options: [
        "Absolute, in dBm, backed by factory calibration",
        "Relative, shifting with gain settings",
        "Identical in every respect",
        "Only meaningful below 1.7 GHz"
      ],
      answer: 0,
      explain: "Hobby SDR displays are relative and uncalibrated, while the instrument reports absolute power in dBm from factory calibration."
    },
    {
      q: "When the calibrated front end is overdriven during streaming, the instrument's driver responds by:",
      options: [
        "Silently clipping the samples",
        "Muting the audio output",
        "Automatically halving the sample rate",
        "Raising an IF overflow error and expecting you to increase the reference level"
      ],
      answer: 3,
      explain: "Instead of clipping silently, the driver flags an IF overflow error, enforcing the same headroom discipline as the instrument's front panel."
    },
    {
      q: "An RTL-SDR dongle's tuning range tops out near:",
      options: [
        "6 GHz",
        "1.7 GHz",
        "40 GHz",
        "100 MHz"
      ],
      answer: 1,
      explain: "An RTL-SDR tunes from roughly 24 MHz to about 1.7 GHz, far below the 40 GHz reach of a modern USB RTSA."
    },
    {
      q: "A GNU Radio flowgraph is best described as:",
      options: [
        "A directed graph of processing blocks in which sources produce samples and sinks consume them",
        "A schematic of the analog RF front end",
        "A frequency allocation plan",
        "A table of calibration coefficients"
      ],
      answer: 0,
      explain: "A flowgraph is a directed graph of blocks; the runtime schedules them and moves sample buffers between them."
    },
    {
      q: "An out-of-tree (OOT) module in GNU Radio is:",
      options: [
        "A block that executes on the instrument's FPGA",
        "A deprecated block scheduled for removal",
        "An independently distributed package of custom blocks that appears in GRC through a YAML descriptor",
        "A plugin that only runs on Windows"
      ],
      answer: 2,
      explain: "OOT modules are custom block packages maintained outside the main tree, with YAML descriptors that expose them in GNU Radio Companion."
    },
    {
      q: "SoapySDR's role in the open SDR ecosystem is to:",
      options: [
        "Demodulate single-sideband audio",
        "Provide a vendor-neutral abstraction layer so any SoapySDR-aware application can use a supported device",
        "Replace GNU Radio's scheduler",
        "Compress recorded I/Q files"
      ],
      answer: 1,
      explain: "SoapySDR is an abstraction layer: one driver exposes a device to SDR++, GQRX, CubicSDR, GNU Radio, rtl_433, and other Soapy-aware software."
    },
    {
      q: "Recording 100 MS/s of complex 16-bit I/Q samples requires sustained disk throughput of about:",
      options: [
        "4 MB/s",
        "40 MB/s",
        "100 MB/s",
        "400 MB/s"
      ],
      answer: 3,
      explain: "Each complex 16-bit sample is 4 bytes, so 100 MS/s times 4 bytes is 400 MB/s, roughly 24 GB per minute."
    },
    {
      q: "The significance of decoders like gr-adsb running unmodified from the instrument's IQ source block is that:",
      options: [
        "The ecosystem's existing decoders become the instrument's application library without any code changes",
        "They run faster on 8-bit samples",
        "They prove the decoders only work on hobby hardware",
        "It demonstrates the instrument can transmit"
      ],
      answer: 0,
      explain: "Because blocks only exchange samples, swapping in the calibrated source lets a decade of contributed decoders run from instrument-grade I/Q unchanged."
    }
  ]
};
