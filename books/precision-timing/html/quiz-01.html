<script data-cookieconsent="ignore">
/* Paid-click attribution. Runs before the GTM container so `dataLayer` exists for every
   page, and so a gclid is captured on the landing page even if the visitor converts three
   pages later. `window.BNC_ATTR` is what the forms read on submit.

   Storage is tiered on purpose. sessionStorage is always written, so an ad click that
   converts in the same visit is attributable regardless of the cookie banner. The 90-day
   first-party cookie — the only part that tracks across visits — is written only once
   Cookiebot reports marketing consent. */
(function (w, d) {
  w.dataLayer = w.dataLayer || [];
  var KEYS = ['gclid', 'wbraid', 'gbraid', 'msclkid',
              'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
  var CLICK_IDS = ['gclid', 'wbraid', 'gbraid', 'msclkid'];
  var NAME = 'bnc_attr', MAX_AGE = 7776000; /* 90 days */

  function readCookie() {
    try {
      var m = d.cookie.match(/(?:^|;\s*)bnc_attr=([^;]*)/);
      return m ? JSON.parse(decodeURIComponent(m[1])) : null;
    } catch (e) { return null; }
  }
  function writeCookie(o) {
    try {
      d.cookie = NAME + '=' + encodeURIComponent(JSON.stringify(o)) + ';path=/;max-age=' +
        MAX_AGE + ';samesite=lax' + (location.protocol === 'https:' ? ';secure' : '');
    } catch (e) {}
  }
  function readSession() {
    try { return JSON.parse(sessionStorage.getItem(NAME) || 'null'); } catch (e) { return null; }
  }
  function writeSession(o) {
    try { sessionStorage.setItem(NAME, JSON.stringify(o)); } catch (e) {}
  }
  function marketingOk() {
    try { return !!(w.Cookiebot && w.Cookiebot.consent && w.Cookiebot.consent.marketing); }
    catch (e) { return false; }
  }

  var q, fresh = {}, hasFresh = false, hasClickId = false;
  try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
  if (q) {
    for (var i = 0; i < KEYS.length; i++) {
      var v = q.get(KEYS[i]);
      if (v) {
        fresh[KEYS[i]] = String(v).slice(0, 200);
        hasFresh = true;
        if (CLICK_IDS.indexOf(KEYS[i]) !== -1) hasClickId = true;
      }
    }
  }

  var attr = readSession() || readCookie();
  /* A new click id always wins — it is a fresh paid visit. Campaign params without a click
     id only fill in when nothing is stored yet, so an internal link carrying stale UTMs
     cannot overwrite the real acquisition source. */
  if (hasFresh && (hasClickId || !attr)) {
    fresh.landing_page = String(location.pathname).slice(0, 300);
    fresh.first_seen = new Date().toISOString();
    attr = fresh;
    writeSession(attr);
    if (marketingOk()) writeCookie(attr);
  }
  w.BNC_ATTR = attr || {};

  /* Cookiebot resolves after this script. Promote to the cross-visit cookie once, if and
     when marketing consent lands. */
  function promote() { if (w.BNC_ATTR && w.BNC_ATTR.first_seen && marketingOk()) writeCookie(w.BNC_ATTR); }
  w.addEventListener('CookiebotOnAccept', promote);
  w.addEventListener('CookiebotOnConsentReady', promote);

  /* Native (non-fetch) forms post straight to /api/form, so the values have to ride along
     as hidden inputs. Fetch-based forms read window.BNC_ATTR directly instead. */
  function stamp() {
    if (!w.BNC_ATTR || !w.BNC_ATTR.first_seen) return;
    var forms = d.getElementsByTagName('form');
    for (var i = 0; i < forms.length; i++) {
      var f = forms[i];
      if (f.getAttribute('data-bnc-attr') === '1') continue;
      if (!/\/api\/form/.test(f.getAttribute('action') || '')) continue;
      f.setAttribute('data-bnc-attr', '1');
      for (var k in w.BNC_ATTR) {

        var el = d.createElement('input');
        el.type = 'hidden'; el.name = k; el.value = w.BNC_ATTR[k];
        f.appendChild(el);
      }
    }
  }
  if (d.readyState === 'loading') d.addEventListener('DOMContentLoaded', stamp);
  else stamp();

<div id="bnc-quiz"></div>

<script>
window.QUIZ_DATA = {
  bookKey: "tmi",
  chapterKey: "01",
  title: "Chapter 1 Quiz: General Properties of a Timing Signal",
  questions: [
    {
      q: "What is the difference between resolution and accuracy?",
      options: [
        "They are two names for the same specification",
        "Resolution is the finest settable step; accuracy is how close the hardware comes to delivering that value",
        "Resolution is how close the hardware comes; accuracy is the smallest step",
        "Resolution applies to delay and accuracy applies to width only"
      ],
      answer: 1,
      explain: "Resolution is the size of the smallest step you can request. Accuracy is a separate spec describing how close the hardware comes to that value. The two are independent."
    },
    {
      q: "From which point is the programmed delay usually measured, and what is that reference called?",
      options: [
        "From the falling edge of the output, called the period",
        "From the leading edge of the trigger pulse, called To",
        "From the half-amplitude point of the output, called the width",
        "From the 10 percent point of the rising edge, called the threshold"
      ],
      answer: 1,
      explain: "Delay is measured from the leading edge of the trigger pulse, the reference point called To, to the leading edge of the timed pulse. To is the anchor for every channel's timing."
    },
    {
      q: "Rise time is typically measured as the time for a signal to move between which two points on the leading edge?",
      options: [
        "0 percent and 100 percent of maximum amplitude",
        "10 percent and 90 percent of maximum amplitude",
        "The trigger and the falling edge",
        "Half amplitude and full amplitude"
      ],
      answer: 1,
      explain: "Rise time is the 10 percent to 90 percent transition on the leading edge. A 20 percent to 80 percent measurement is sometimes used instead."
    },
    {
      q: "What is insertion delay?",
      options: [
        "The adjustable delay the user programs between trigger and output",
        "The time to remote-program the instrument over GPIB",
        "A fixed delay from the Trigger In signal to the first timing period, built into the design",
        "The ringing at the top of a pulse before it settles"
      ],
      answer: 2,
      explain: "Insertion delay is a fixed, design-determined delay from Trigger In to the first timing period. It is inherent to the hardware, so treat it as a known offset. Good designs minimize it."
    },
    {
      q: "What does the pulse repetition rate (PRF) describe, and how does it relate to the period?",
      options: [
        "The output voltage; the period is its reciprocal",
        "How often the cycle repeats in pulses per second; the period is its reciprocal",
        "The width of each pulse; the period is the same value",
        "The slope of the trigger; the period is unrelated"
      ],
      answer: 1,
      explain: "The repetition rate is how often the timing cycle repeats, expressed as pulses per second. The period is its reciprocal, and you can set whichever is natural for the task."
    }
  ]
};
</script>
