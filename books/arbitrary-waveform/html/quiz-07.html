<script data-cookieconsent="ignore">
/* Paid-click attribution. Runs before the GTM container so `dataLayer` exists for every
   page, and so a gclid is captured on the landing page even if the visitor converts three
   pages later. `window.BNC_ATTR` is what the forms read on submit.

   Storage is tiered on purpose. sessionStorage is always written, so an ad click that
   converts in the same visit is attributable regardless of the cookie banner. The 90-day
   first-party cookie — the only part that tracks across visits — is written only once
   Cookiebot reports marketing consent. */
(function (w, d) {
  w.dataLayer = w.dataLayer || [];
  var KEYS = ['gclid', 'wbraid', 'gbraid', 'msclkid',
              'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
  var CLICK_IDS = ['gclid', 'wbraid', 'gbraid', 'msclkid'];
  var NAME = 'bnc_attr', MAX_AGE = 7776000; /* 90 days */

  function readCookie() {
    try {
      var m = d.cookie.match(/(?:^|;\s*)bnc_attr=([^;]*)/);
      return m ? JSON.parse(decodeURIComponent(m[1])) : null;
    } catch (e) { return null; }
  }
  function writeCookie(o) {
    try {
      d.cookie = NAME + '=' + encodeURIComponent(JSON.stringify(o)) + ';path=/;max-age=' +
        MAX_AGE + ';samesite=lax' + (location.protocol === 'https:' ? ';secure' : '');
    } catch (e) {}
  }
  function readSession() {
    try { return JSON.parse(sessionStorage.getItem(NAME) || 'null'); } catch (e) { return null; }
  }
  function writeSession(o) {
    try { sessionStorage.setItem(NAME, JSON.stringify(o)); } catch (e) {}
  }
  function marketingOk() {
    try { return !!(w.Cookiebot && w.Cookiebot.consent && w.Cookiebot.consent.marketing); }
    catch (e) { return false; }
  }

  var q, fresh = {}, hasFresh = false, hasClickId = false;
  try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
  if (q) {
    for (var i = 0; i < KEYS.length; i++) {
      var v = q.get(KEYS[i]);
      if (v) {
        fresh[KEYS[i]] = String(v).slice(0, 200);
        hasFresh = true;
        if (CLICK_IDS.indexOf(KEYS[i]) !== -1) hasClickId = true;
      }
    }
  }

  var attr = readSession() || readCookie();
  /* A new click id always wins — it is a fresh paid visit. Campaign params without a click
     id only fill in when nothing is stored yet, so an internal link carrying stale UTMs
     cannot overwrite the real acquisition source. */
  if (hasFresh && (hasClickId || !attr)) {
    fresh.landing_page = String(location.pathname).slice(0, 300);
    fresh.first_seen = new Date().toISOString();
    attr = fresh;
    writeSession(attr);
    if (marketingOk()) writeCookie(attr);
  }
  w.BNC_ATTR = attr || {};

  /* Cookiebot resolves after this script. Promote to the cross-visit cookie once, if and
     when marketing consent lands. */
  function promote() { if (w.BNC_ATTR && w.BNC_ATTR.first_seen && marketingOk()) writeCookie(w.BNC_ATTR); }
  w.addEventListener('CookiebotOnAccept', promote);
  w.addEventListener('CookiebotOnConsentReady', promote);

  /* Native (non-fetch) forms post straight to /api/form, so the values have to ride along
     as hidden inputs. Fetch-based forms read window.BNC_ATTR directly instead. */
  function stamp() {
    if (!w.BNC_ATTR || !w.BNC_ATTR.first_seen) return;
    var forms = d.getElementsByTagName('form');
    for (var i = 0; i < forms.length; i++) {
      var f = forms[i];
      if (f.getAttribute('data-bnc-attr') === '1') continue;
      if (!/\/api\/form/.test(f.getAttribute('action') || '')) continue;
      f.setAttribute('data-bnc-attr', '1');
      for (var k in w.BNC_ATTR) {
        if (!Object.prototype.hasOwnProperty.call(w.BNC_ATTR, k)) continue;
        var el = d.createElement('input');
        el.type = 'hidden'; el.name = k; el.value = w.BNC_ATTR[k];
        f.appendChild(el);
      }
    }
  }
  if (d.readyState === 'loading') d.addEventListener('DOMContentLoaded', stamp);
  else stamp();

  /* Conversion event for forms that never navigate. The forms that post natively land on
     thank-you.html, which fires this for them. The fetch-based ones — QuickQuote, the
     datasheet PDF configurator, the line-card quote, the book resource forms and quizzes —
     stay on the page and show an inline success, so they have to fire it themselves.
     Between them they cover most of the site's form volume and none of it was measurable.
     Call once, on confirmed success only. */
  w.bncTrackFormSubmit = function (formType) {
    try {
      var ev = { event: 'form_submission_complete', form_type: String(formType || 'contact') };
      var a = w.BNC_ATTR || {};
      if (a.gclid) ev.gclid = a.gclid;
      if (a.utm_source) ev.utm_source = a.utm_source;
      if (a.utm_campaign) ev.utm_campaign = a.utm_campaign;
      w.dataLayer.push(ev);
    } catch (e) {}
  };
})(window, document);
</script>

<script>window.QUIZ_DATA = { bookKey:"awg", chapterKey:"07", title:"Chapter 7 Quiz: Triggering, Synchronization, and Multi-Channel", questions:[
  {
    q: "What is the purpose of trigger holdoff?",
    options: [
      "It increases the output amplitude after a trigger",
      "It is a blanking interval after a valid trigger during which further triggers are ignored, preventing double-triggering on a noisy or bouncing edge",
      "It selects whether the instrument triggers on the rising or falling edge",
      "It sets the number of cycles played in burst mode"
    ],
    answer: 1,
    explain: "Holdoff blanks out additional triggers for a set interval after a valid one, so ringing or a bouncing edge cannot fire the instrument twice. Too short risks double-triggering; too long risks missing real events."
  },
  {
    q: "In which trigger mode does the AWG play its waveform exactly once on each trigger event and then return to the armed state?",
    options: [
      "Continuous mode",
      "Gated mode",
      "Triggered (single-shot) mode",
      "Internal mode"
    ],
    answer: 2,
    explain: "Single-shot mode arms the instrument, plays the record once on the trigger event, then re-arms to wait for the next event. It is the mode for one-time responses and single pulses."
  },
  {
    q: "A marker (sync output) is most useful because it is generated from the same clock and sample stream as the analog output. What does that let it do?",
    options: [
      "Replace the need for a sample clock entirely",
      "Provide a clean digital edge aligned to a precise sample position, ideal for triggering a scope or gating a device under test",
      "Increase the instrument's vertical resolution",
      "Convert the analog output into IQ baseband"
    ],
    answer: 1,
    explain: "Because the marker is tied to a defined sample index in the record, it carries the instrument's own timing precision and lands at the same point in the analog output every play, which makes it an excellent trigger or gate."
  },
  {
    q: "Why is a shared 10 MHz reference NOT the same as deterministic sample alignment between two instruments?",
    options: [
      "A 10 MHz reference cannot be distributed to more than one instrument",
      "The reference disciplines frequency so the instruments do not drift, but each instrument's clock divider can come up in a different phase, so they may sit hundreds of picoseconds or a full sample apart at start",
      "A shared reference forces both instruments to use the same waveform",
      "The reference only works for analog outputs, not digital markers"
    ],
    answer: 1,
    explain: "A shared reference gives frequency coherence (no long-term drift) but says nothing about which sample each instrument plays at a given instant. Sample-level alignment needs a shared clock plus a synchronization protocol that aligns the dividers and applies a common start trigger."
  },
  {
    q: "After establishing phase coherence across channels, what step turns a phase-coherent instrument into a phase-accurate one?",
    options: [
      "Raising the sample rate until skew disappears",
      "Switching every channel to continuous mode",
      "Calibrating skew: output the same signal on all channels, measure the offset on a fast scope, and apply a per-channel programmable delay until they align",
      "Removing the shared reference so the channels run independently"
    ],
    answer: 2,
    explain: "Phase coherence gives a fixed, stable relationship; accuracy requires measuring the residual fixed skew between channels and removing it with per-channel delay. The calibration holds until a cable or temperature change forces a redo."
  }
] };</script>
