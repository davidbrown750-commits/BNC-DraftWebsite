<script data-cookieconsent="ignore">
/* Paid-click attribution. Runs before the GTM container so `dataLayer` exists for every
   page, and so a gclid is captured on the landing page even if the visitor converts three
   pages later. `window.BNC_ATTR` is what the forms read on submit.

   Storage is tiered on purpose. sessionStorage is always written, so an ad click that
   converts in the same visit is attributable regardless of the cookie banner. The 90-day
   first-party cookie — the only part that tracks across visits — is written only once
   Cookiebot reports marketing consent. */
(function (w, d) {
  w.dataLayer = w.dataLayer || [];
  var KEYS = ['gclid', 'wbraid', 'gbraid', 'msclkid',
              'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
  var CLICK_IDS = ['gclid', 'wbraid', 'gbraid', 'msclkid'];
  var NAME = 'bnc_attr', MAX_AGE = 7776000; /* 90 days */

  function readCookie() {
    try {
      var m = d.cookie.match(/(?:^|;\s*)bnc_attr=([^;]*)/);
      return m ? JSON.parse(decodeURIComponent(m[1])) : null;
    } catch (e) { return null; }
  }
  function writeCookie(o) {
    try {
      d.cookie = NAME + '=' + encodeURIComponent(JSON.stringify(o)) + ';path=/;max-age=' +
        MAX_AGE + ';samesite=lax' + (location.protocol === 'https:' ? ';secure' : '');
    } catch (e) {}
  }
  function readSession() {
    try { return JSON.parse(sessionStorage.getItem(NAME) || 'null'); } catch (e) { return null; }
  }
  function writeSession(o) {
    try { sessionStorage.setItem(NAME, JSON.stringify(o)); } catch (e) {}
  }
  function marketingOk() {
    try { return !!(w.Cookiebot && w.Cookiebot.consent && w.Cookiebot.consent.marketing); }
    catch (e) { return false; }
  }

  var q, fresh = {}, hasFresh = false, hasClickId = false;
  try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
  if (q) {
    for (var i = 0; i < KEYS.length; i++) {
      var v = q.get(KEYS[i]);
      if (v) {
        fresh[KEYS[i]] = String(v).slice(0, 200);
        hasFresh = true;
        if (CLICK_IDS.indexOf(KEYS[i]) !== -1) hasClickId = true;
      }
    }
  }

  var attr = readSession() || readCookie();
  /* A new click id always wins — it is a fresh paid visit. Campaign params without a click
     id only fill in when nothing is stored yet, so an internal link carrying stale UTMs
     cannot overwrite the real acquisition source. */
  if (hasFresh && (hasClickId || !attr)) {
    fresh.landing_page = String(location.pathname).slice(0, 300);
    fresh.first_seen = new Date().toISOString();
    attr = fresh;
    writeSession(attr);
    if (marketingOk()) writeCookie(attr);
  }
  w.BNC_ATTR = attr || {};

  /* Cookiebot resolves after this script. Promote to the cross-visit cookie once, if and
     when marketing consent lands. */
  function promote() { if (w.BNC_ATTR && w.BNC_ATTR.first_seen && marketingOk()) writeCookie(w.BNC_ATTR); }
  w.addEventListener('CookiebotOnAccept', promote);
  w.addEventListener('CookiebotOnConsentReady', promote);

  /* Native (non-fetch) forms post straight to /api/form, so the values have to ride along
     as hidden inputs. Fetch-based forms read window.BNC_ATTR directly instead. */
  function stamp() {
    if (!w.BNC_ATTR || !w.BNC_ATTR.first_seen) return;
    var forms = d.getElementsByTagName('form');
    for (var i = 0; i < forms.length; i++) {
      var f = forms[i];
      if (f.getAttribute('data-bnc-attr') === '1') continue;
      if (!/\/api\/form/.test(f.getAttribute('action') || '')) continue;
      f.setAttribute('data-bnc-attr', '1');
      for (var k in w.BNC_ATTR) {
        if (!Object.prototype.hasOwnProperty.call(w.BNC_ATTR, k)) continue;
        var el = d.createElement('input');
        el.type = 'hidden'; el.name = k; el.value = w.BNC_ATTR[k];
        f.appendChild(el);
      }
    }
  }
  if (d.readyState === 'loading') d.addEventListener('DOMContentLoaded', stamp);
  else stamp();

  /* Conversion event for forms that never navigate. The forms that post natively land on
     thank-you.html, which fires this for them. The fetch-based ones — QuickQuote, the
     datasheet PDF configurator, the line-card quote, the book resource forms and quizzes —
     stay on the page and show an inline success, so they have to fire it themselves.
     Between them they cover most of the site's form volume and none of it was measurable.
     Call once, on confirmed success only. */
  w.bncTrackFormSubmit = function (formType) {
    try {
      var ev = { event: 'form_submission_complete', form_type: String(formType || 'contact') };
      var a = w.BNC_ATTR || {};
      if (a.gclid) ev.gclid = a.gclid;
      if (a.utm_source) ev.utm_source = a.utm_source;
      if (a.utm_campaign) ev.utm_campaign = a.utm_campaign;
      w.dataLayer.push(ev);
    } catch (e) {}
  };

  /* A form carrying `_next` sends the visitor back where they came from instead of to
     thank-you.html — the ScintIQ configurator does this — so the conversion has to travel
     with them. /api/form appends `bnc_fs=<form type>` to that redirect and this fires it on
     arrival. The param is then stripped from the address bar so a refresh or a shared link
     cannot count a second time. */
  if (q) {
    var fs = q.get('bnc_fs');
    if (fs) {
      w.bncTrackFormSubmit(String(fs).toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 32));
      try {
        q.delete('bnc_fs');
        var rest = q.toString();
        history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
      } catch (e) {}
    }
  }
})(window, document);
</script>

<script>window.QUIZ_DATA = { bookKey:"awg", chapterKey:"02", title:"Chapter 2 Quiz: How an AWG Works", questions:[
  {
    q: "An AWG stores a 2,000-sample waveform and clocks it out at 200 MSa/s, looping continuously. What is the output frequency of the repeating waveform?",
    options: [
      "10 kHz",
      "100 kHz",
      "400 kHz",
      "200 MHz"
    ],
    answer: 1,
    explain: "One loop lasts depth / sample rate = 2,000 / 200,000,000 = 10 microseconds. The repetition rate is 1 / 10 us = 100 kHz."
  },
  {
    q: "What does the reconstruction (anti-imaging) filter remove from the DAC output?",
    options: [
      "DC offset added by the output amplifier",
      "Quantization noise from the finite bit depth",
      "The high-frequency spectral images created by sampling, leaving the smooth waveform",
      "Glitch energy generated inside the DAC core"
    ],
    answer: 2,
    explain: "Sampling produces copies (images) of the signal spectrum around multiples of the sample rate. The low-pass reconstruction filter removes those images and smooths the staircase into a continuous waveform."
  },
  {
    q: "Which statement best distinguishes direct digital synthesis (DDS) from true arbitrary playback?",
    options: [
      "DDS uses a phase accumulator and lookup table for fine-resolution tones; true arb reads sequential memory point by point",
      "DDS requires deeper memory than true arbitrary playback",
      "True arb can only produce sine waves, while DDS produces any shape",
      "DDS works only above 1 GHz, true arb only below"
    ],
    answer: 0,
    explain: "DDS steps a phase accumulator into a waveform lookup table, giving very fine frequency resolution for repetitive tones. True arb reads stored samples sequentially, one per clock, reproducing any waveform you loaded."
  },
  {
    q: "Why is DAC quality usually the dominant factor in an AWG's output fidelity?",
    options: [
      "The DAC sets the maximum memory depth of the instrument",
      "The DAC is the digital-to-analog border, so its resolution, update rate, and glitch energy set the noise floor and spurious performance",
      "The DAC determines the trigger latency",
      "The DAC controls the 50-ohm output impedance"
    ],
    answer: 1,
    explain: "Everything before the DAC is noise-free numbers. The DAC turns codes into volts, so its bit depth, update rate, and glitch energy largely determine dynamic range and spurious-free performance."
  },
  {
    q: "A bench instrument offers standard sine, square, and ramp shapes plus 256K points of arbitrary memory at a moderate sample rate. Which family does it belong to?",
    options: [
      "A pure function generator with no arbitrary capability",
      "An arbitrary function generator (AWFG)",
      "A true high-speed AWG with gigasample memory",
      "A digital pattern generator"
    ],
    answer: 1,
    explain: "Standard DDS shapes plus modest arbitrary memory at a bench-appropriate sample rate is the arbitrary function generator (AWFG) class, the middle ground between a plain function generator and a deep-memory high-speed AWG."
  }
] };</script>
