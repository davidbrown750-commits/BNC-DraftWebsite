<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial,Helvetica,sans-serif">
  <title>From a rotating phasor to interleaved I/Q sample streams</title>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#113163">One rotating phasor, two sample streams</text>
  <text x="450" y="58" text-anchor="middle" font-size="15" fill="#5a6472">The I and Q projections of the phasor are sampled together: every tick of the sample clock emits one (I, Q) pair</text>

  <!-- ===== IQ plane ===== -->
  <g>
    <circle cx="215.0" cy="267.0" r="130.0" fill="#f5f7fa" stroke="#d8dde4" stroke-width="2"/>
    <line x1="60.0" y1="267.0" x2="370.0" y2="267.0" stroke="#d8dde4" stroke-width="2"/>
    <line x1="215.0" y1="112.0" x2="215.0" y2="422.0" stroke="#d8dde4" stroke-width="2"/>
    <text x="375.0" y="272.0" font-size="16" font-weight="bold" fill="#0655a3">I</text>
    <text x="221.0" y="105.0" font-size="16" font-weight="bold" fill="#37b6f0">Q</text>

    <!-- projection lines (dashed) -->
    <line x1="345.0" y1="267.0" x2="345.0" y2="267.0" stroke="#0655a3" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.65">
      <animate attributeName="x1" values="345.0;215.0;85.0;215.0;345.0" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.47 0 0.745 0.715;0.39 0.575 0.565 1;0.47 0 0.745 0.715;0.39 0.575 0.565 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="345.0;215.0;85.0;215.0;345.0" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.47 0 0.745 0.715;0.39 0.575 0.565 1;0.47 0 0.745 0.715;0.39 0.575 0.565 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="267.0;137.0;267.0;397.0;267.0" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.39 0.575 0.565 1;0.47 0 0.745 0.715;0.39 0.575 0.565 1;0.47 0 0.745 0.715" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="345.0" y1="267.0" x2="215.0" y2="267.0" stroke="#37b6f0" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.65">
      <animate attributeName="x1" values="345.0;215.0;85.0;215.0;345.0" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.47 0 0.745 0.715;0.39 0.575 0.565 1;0.47 0 0.745 0.715;0.39 0.575 0.565 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="267.0;137.0;267.0;397.0;267.0" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.39 0.575 0.565 1;0.47 0 0.745 0.715;0.39 0.575 0.565 1;0.47 0 0.745 0.715" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="267.0;137.0;267.0;397.0;267.0" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.39 0.575 0.565 1;0.47 0 0.745 0.715;0.39 0.575 0.565 1;0.47 0 0.745 0.715" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- rotating phasor -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 215.0 267.0" to="-360 215.0 267.0" dur="6s" repeatCount="indefinite"/>
      <line x1="215.0" y1="267.0" x2="345.0" y2="267.0" stroke="#113163" stroke-width="4" stroke-linecap="round"/>
      <circle cx="345.0" cy="267.0" r="9" fill="#113163"/>
    </g>

    <!-- projection dots on axes -->
    <circle cx="345.0" cy="267.0" r="7" fill="#0655a3"><animate attributeName="cx" values="345.0;215.0;85.0;215.0;345.0" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.47 0 0.745 0.715;0.39 0.575 0.565 1;0.47 0 0.745 0.715;0.39 0.575 0.565 1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="215.0" cy="267.0" r="7" fill="#37b6f0"><animate attributeName="cy" values="267.0;137.0;267.0;397.0;267.0" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.39 0.575 0.565 1;0.47 0 0.745 0.715;0.39 0.575 0.565 1;0.47 0 0.745 0.715" dur="6s" repeatCount="indefinite"/></circle>
    <text x="215.0" y="445.0" text-anchor="middle" font-size="14" fill="#5a6472">The phasor turns once per cycle of the tuned signal</text>
  </g>

  <!-- ===== wave strips ===== -->
  <defs>
    <clipPath id="clipI"><rect x="430" y="88" width="420" height="124"/></clipPath>
    <clipPath id="clipQ"><rect x="430" y="323" width="420" height="124"/></clipPath>
  </defs>

