94.50 L866.0,186.80 L870.0,177.50" fill="none" stroke="#0655a3" stroke-width="2.5"/>
      <circle cx="290.0" cy="122.50" r="4" fill="#0655a3"/>
<circle cx="320.0" cy="102.37" r="4" fill="#0655a3"/>
<circle cx="350.0" cy="177.50" r="4" fill="#0655a3"/>
