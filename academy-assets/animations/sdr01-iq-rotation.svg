  <!-- now markers at strip entry -->
  <circle cx="430" cy="95" r="6" fill="#113163">
    <animate attributeName="cy" values="95;150;205;150;95" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.47 0 0.745 0.715;0.39 0.575 0.565 1;0.47 0 0.745 0.715;0.39 0.575 0.565 1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="385" r="6" fill="#113163">
    <animate attributeName="cy" values="385;330;385;440;385" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.39 0.575 0.565 1;0.47 0 0.745 0.715;0.39 0.575 0.565 1;0.47 0 0.745 0.715" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="640" y="238" text-anchor="middle" font-size="14" fill="#5a6472">older samples scroll off to the right &#8594;</text>

  <!-- interleaved pair readout -->
  <g>
    <rect x="430" y="462" width="420" height="42" rx="6" fill="#f5f7fa" stroke="#d8dde4"/>
    <text x="446" y="488" font-size="15" fill="#113163" font-weight="bold">Delivered stream:</text>
    <text x="586" y="488" font-size="15" font-family="Arial,Helvetica,sans-serif"><tspan fill="#0655a3" font-weight="bold">I[0]</tspan><tspan fill="#37b6f0" font-weight="bold"> Q[0]</tspan><tspan fill="#0655a3" font-weight="bold"> I[1]</tspan><tspan fill="#37b6f0" font-weight="bold"> Q[1]</tspan><tspan fill="#0655a3" font-weight="bold"> I[2]</tspan><tspan fill="#37b6f0" font-weight="bold"> Q[2]</tspan><tspan fill="#5a6472"> &#8230;</tspan></text>
  </g>
  <text x="215" y="488" text-anchor="middle" font-size="14" fill="#5a6472">One sample = one (I, Q) pair, not two samples</text>
</svg>
