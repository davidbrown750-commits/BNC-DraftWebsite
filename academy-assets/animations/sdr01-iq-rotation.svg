    <line x1="430" y1="385" x2="850" y2="385" stroke="#d8dde4" stroke-width="1.5"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;120 0" dur="6s" repeatCount="indefinite" calcMode="linear"/>
