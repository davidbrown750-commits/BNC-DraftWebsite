<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="spokeGrad" gradientUnits="userSpaceOnUse" x1="45" y1="0" x2="110" y2="0">
      <stop offset="0" stop-color="#0655a3"/>
      <stop offset="1" stop-color="#113163"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0655a3"/>
    </marker>
    <path id="spoke" d="M47.5,-6.7 L105.7,-22.5 Q110,0 105.7,22.5 L47.5,6.7 Q45.5,0 47.5,-6.7 Z" fill="url(#spokeGrad)"/>
    <filter id="form" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0">
        <animate attributeName="stdDeviation" values="9;0" dur="2.5s" fill="freeze"/>
      </feGaussianBlur>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#113163">Inside the magnetron: the rotating space-charge wheel</text>
  <text x="450" y="62" text-anchor="middle" font-size="15" fill="#5a6472">Six electron spokes sweep past twelve resonant cavities, handing energy from the DC field to the RF field</text>

  <!-- anode block and bore -->
  <g transform="translate(450,300)">
    <circle r="180" fill="#d8dde4" stroke="#5a6472" stroke-width="2"/>
    <circle r="112" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/>

    <!-- twelve cavities: hole, slot, and pulsing glow.
         Adjacent cavities glow in opposite phase (pi mode): a spoke arrives every 4/3 s. -->
    <g>
      <g transform="rotate(0)"><circle cx="145" cy="0" r="21" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/><rect x="108" y="-4" width="20" height="8" fill="#ffffff"/><circle cx="145" cy="0" r="14" fill="#37b6f0" opacity="0.95"><animate attributeName="opacity" values="0.95;0.12;0.95" dur="1.33333s" begin="0s" repeatCount="indefinite"/></circle></g>
      <g transform="rotate(30)"><circle cx="145" cy="0" r="21" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/><rect x="108" y="-4" width="20" height="8" fill="#ffffff"/><circle cx="145" cy="0" r="14" fill="#37b6f0" opacity="0.12"><animate attributeName="opacity" values="0.95;0.12;0.95" dur="1.33333s" begin="0.66667s" repeatCount="indefinite"/></circle></g>
      <g transform="rotate(60)"><circle cx="145" cy="0" r="21" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/><rect x="108" y="-4" width="20" height="8" fill="#ffffff"/><circle cx="145" cy="0" r="14" fill="#37b6f0" opacity="0.95"><animate attributeName="opacity" values="0.95;0.12;0.95" dur="1.33333s" begin="0s" repeatCount="indefinite"/></circle></g>
      <g transform="rotate(90)"><circle cx="145" cy="0" r="21" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/><rect x="108" y="-4" width="20" height="8" fill="#ffffff"/><circle cx="145" cy="0" r="14" fill="#37b6f0" opacity="0.12"><animate attributeName="opacity" values="0.95;0.12;0.95" dur="1.33333s" begin="0.66667s" repeatCount="indefinite"/></circle></g>
      <g transform="rotate(120)"><circle cx="145" cy="0" r="21" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/><rect x="108" y="-4" width="20" height="8" fill="#ffffff"/><circle cx="145" cy="0" r="14" fill="#37b6f0" opacity="0.95"><animate attributeName="opacity" values="0.95;0.12;0.95" dur="1.33333s" begin="0s" repeatCount="indefinite"/></circle></g>
      <g transform="rotate(150)"><circle cx="145" cy="0" r="21" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/><rect x="108" y="-4" width="20" height="8" fill="#ffffff"/><circle cx="145" cy="0" r="14" fill="#37b6f0" opacity="0.12"><animate attributeName="opacity" values="0.95;0.12;0.95" dur="1.33333s" begin="0.66667s" repeatCount="indefinite"/></circle></g>
      <g transform="rotate(180)"><circle cx="145" cy="0" r="21" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/><rect x="108" y="-4" width="20" height="8" fill="#ffffff"/><circle cx="145" cy="0" r="14" fill="#37b6f0" opacity="0.95"><animate attributeName="opacity" values="0.95;0.12;0.95" dur="1.33333s" begin="0s" repeatCount="indefinite"/></circle></g>
      <g transform="rotate(210)"><circle cx="145" cy="0" r="21" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/><rect x="108" y="-4" width="20" height="8" fill="#ffffff"/><circle cx="145" cy="0" r="14" fill="#37b6f0" opacity="0.12"><animate attributeName="opacity" values="0.95;0.12;0.95" dur="1.33333s" begin="0.66667s" repeatCount="indefinite"/></circle></g>
      <g transform="rotate(240)"><circle cx="145" cy="0" r="21" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/><rect x="108" y="-4" width="20" height="8" fill="#ffffff"/><circle cx="145" cy="0" r="14" fill="#37b6f0" opacity="0.95"><animate attributeName="opacity" values="0.95;0.12;0.95" dur="1.33333s" begin="0s" repeatCount="indefinite"/></circle></g>
      <g transform="rotate(270)"><circle cx="145" cy="0" r="21" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/><rect x="108" y="-4" width="20" height="8" fill="#ffffff"/><circle cx="145" cy="0" r="14" fill="#37b6f0" opacity="0.12"><animate attributeName="opacity" values="0.95;0.12;0.95" dur="1.33333s" begin="0.66667s" repeatCount="indefinite"/></circle></g>
      <g transform="rotate(300)"><circle cx="145" cy="0" r="21" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/><rect x="108" y="-4" width="20" height="8" fill="#ffffff"/><circle cx="145" cy="0" r="14" fill="#37b6f0" opacity="0.95"><animate attributeName="opacity" values="0.95;0.12;0.95" dur="1.33333s" begin="0s" repeatCount="indefinite"/></circle></g>
      <g transform="rotate(330)"><circle cx="145" cy="0" r="21" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/><rect x="108" y="-4" width="20" height="8" fill="#ffffff"/><circle cx="145" cy="0" r="14" fill="#37b6f0" opacity="0.12"><animate attributeName="opacity" values="0.95;0.12;0.95" dur="1.33333s" begin="0.66667s" repeatCount="indefinite"/></circle></g>
    </g>

    <!-- space-charge wheel: six spokes forming, then rotating with the RF field -->
    <g filter="url(#form)" opacity="1">
      <animate attributeName="opacity" values="0.1;1" dur="2.5s" fill="freeze"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
        <g><use href="#spoke"/><circle cx="62" cy="0" r="3" fill="#37b6f0"/><circle cx="80" cy="-7" r="3" fill="#37b6f0"/><circle cx="80" cy="7" r="3" fill="#37b6f0"/><circle cx="98" cy="0" r="3" fill="#37b6f0"/></g>
        <g transform="rotate(60)"><use href="#spoke"/><circle cx="62" cy="0" r="3" fill="#37b6f0"/><circle cx="80" cy="-7" r="3" fill="#37b6f0"/><circle cx="80" cy="7" r="3" fill="#37b6f0"/><circle cx="98" cy="0" r="3" fill="#37b6f0"/></g>
        <g transform="rotate(120)"><use href="#spoke"/><circle cx="62" cy="0" r="3" fill="#37b6f0"/><circle cx="80" cy="-7" r="3" fill="#37b6f0"/><circle cx="80" cy="7" r="3" fill="#37b6f0"/><circle cx="98" cy="0" r="3" fill="#37b6f0"/></g>
        <g transform="rotate(180)"><use href="#spoke"/><circle cx="62" cy="0" r="3" fill="#37b6f0"/><circle cx="80" cy="-7" r="3" fill="#37b6f0"/><circle cx="80" cy="7" r="3" fill="#37b6f0"/><circle cx="98" cy="0" r="3" fill="#37b6f0"/></g>
        <g transform="rotate(240)"><use href="#spoke"/><circle cx="62" cy="0" r="3" fill="#37b6f0"/><circle cx="80" cy="-7" r="3" fill="#37b6f0"/><circle cx="80" cy="7" r="3" fill="#37b6f0"/><circle cx="98" cy="0" r="3" fill="#37b6f0"/></g>
        <g transform="rotate(300)"><use href="#spoke"/><circle cx="62" cy="0" r="3" fill="#37b6f0"/><circle cx="80" cy="-7" r="3" fill="#37b6f0"/><circle cx="80" cy="7" r="3" fill="#37b6f0"/><circle cx="98" cy="0" r="3" fill="#37b6f0"/></g>
      </g>
    </g>

    <!-- cathode -->
    <circle r="40" fill="#0655a3" stroke="#113163" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="15" fill="#ffffff">Cathode</text>
  </g>

  <!-- rotation arrow -->
  <path d="M564.7,136.2 A200,200 0 0 1 631.2,215.4" fill="none" stroke="#0655a3" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="668" y="140" font-size="15" fill="#0655a3">Wheel rotates two anode</text>
  <text x="668" y="159" font-size="15" fill="#0655a3">segments per RF cycle</text>

  <!-- RF output wave -->
  <path d="M640,300 q9,-14 18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0" fill="none" stroke="#37b6f0" stroke-width="3" stroke-dasharray="6 5">
    <animate attributeName="stroke-dashoffset" values="11;0" dur="0.45s" repeatCount="indefinite"/>
  </path>
  <text x="748" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#0655a3">RF out</text>

  <!-- labels -->
  <text x="30" y="100" font-size="14" fill="#5a6472">B field: out of the page (permanent magnet); E field: radial, anode to cathode</text>

  <text x="30" y="256" font-size="15" fill="#5a6472">Anode block (solid copper)</text>
  <line x1="212" y1="260" x2="296" y2="278" stroke="#5a6472" stroke-width="1.5"/>

  <text x="132" y="140" font-size="15" fill="#5a6472">Resonant cavity (one of twelve)</text>
  <line x1="342" y1="144" x2="432" y2="153" stroke="#5a6472" stroke-width="1.5"/>

  <text x="30" y="472" font-size="15" fill="#5a6472">Space-charge wheel: six electron spokes</text>
  <line x1="240" y1="458" x2="368" y2="382" stroke="#5a6472" stroke-width="1.5"/>

  <text x="898" y="472" text-anchor="end" font-size="15" fill="#5a6472">A cavity glows as a spoke sweeps past,</text>
  <text x="898" y="491" text-anchor="end" font-size="15" fill="#5a6472">handing energy to the RF field</text>
  <line x1="660" y1="462" x2="530" y2="430" stroke="#5a6472" stroke-width="1.5"/>
</svg>
