<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#113163">Jitter and the averaged edge</text>

  <!-- ===== Panel 1: trigger ===== -->
  <text x="60" y="72" font-size="14" font-weight="bold" fill="#0655a3" letter-spacing="1">TRIGGER</text>
  <path d="M60 130 H170 V90 H230 V130 H330" fill="none" stroke="#113163" stroke-width="2.5"/>
  <!-- repeating fire flash on the leading edge -->
  <circle cx="170" cy="110" r="3.5" fill="#37b6f0"/>
  <circle cx="170" cy="110" r="3" fill="none" stroke="#37b6f0" stroke-width="2">
    <animate attributeName="r" values="3;17" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="60" y="152" font-size="13" fill="#5a6472">fires every cycle</text>

  <!-- programmed delay arrow -->
  <line x1="240" y1="110" x2="533" y2="110" stroke="#5a6472" stroke-width="1.5" stroke-dasharray="6 5"/>
  <polygon points="545,110 534,105 534,115" fill="#5a6472"/>
  <text x="392" y="100" text-anchor="middle" font-size="14" fill="#5a6472">programmed delay</text>

  <!-- ideal instant -->
  <line x1="560" y1="95" x2="560" y2="332" stroke="#5a6472" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="572" y="150" font-size="14" fill="#5a6472">ideal instant</text>

  <!-- ===== Panel 2: returning edges ===== -->
  <text x="60" y="182" font-size="14" font-weight="bold" fill="#0655a3" letter-spacing="1">RETURNING EDGES (MANY SHOTS)</text>

  <!-- RMS band: wide while scattered, then tightens -->
  <rect y="196" height="128" fill="#37b6f0" fill-opacity="0.13">
    <animate attributeName="x" values="480;480;545.5;545.5;480" keyTimes="0;0.35;0.55;0.9;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="width" values="160;160;29;29;160" keyTimes="0;0.35;0.55;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="560" y="192" text-anchor="middle" font-size="14" fill="#0655a3">RMS band</text>

  <!-- scatter group: pivot at x=560, horizontal scale tightens over the loop -->
  <g transform="translate(560 0)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1;0.18 1;0.18 1;1 1" keyTimes="0;0.35;0.55;0.9;1" dur="8s" repeatCount="indefinite" additive="sum"/>
      <g transform="translate(-560 0)">
        <g stroke="#0655a3" stroke-width="2" fill="none" opacity="0.4">
          <path d="M470 315 L552 315 L568 205 L660 205">
            <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="-34 0;18 0;-8 0;27 0;-20 0;6 0;-34 0" dur="0.9s" repeatCount="indefinite"/>
          </path>
          <path d="M470 315 L552 315 L568 205 L660 205">
            <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="22 0;-15 0;31 0;-4 0;12 0;-28 0;22 0" dur="1.1s" repeatCount="indefinite"/>
          </path>
          <path d="M470 315 L552 315 L568 205 L660 205">
            <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="-6 0;29 0;-24 0;10 0;-33 0;16 0;-6 0" dur="0.7s" repeatCount="indefinite"/>
          </path>
          <path d="M470 315 L552 315 L568 205 L660 205">
            <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="14 0;-26 0;5 0;-12 0;24 0;-18 0;14 0" dur="1.3s" repeatCount="indefinite"/>
          </path>
          <path d="M470 315 L552 315 L568 205 L660 205">
            <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="-29 0;8 0;20 0;-14 0;2 0;25 0;-29 0" dur="0.8s" repeatCount="indefinite"/>
          </path>
          <path d="M470 315 L552 315 L568 205 L660 205">
            <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="9 0;-21 0;33 0;-2 0;-16 0;12 0;9 0" dur="1s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== Panel 3: averaged pulse ===== -->
  <text x="60" y="362" font-size="14" font-weight="bold" fill="#0655a3" letter-spacing="1">AVERAGED PULSE</text>
  <line x1="60" y1="465" x2="840" y2="465" stroke="#d8dde4" stroke-width="1"/>

  <!-- smeared average: visible while the scatter is wide -->
  <path d="M330 460 C440 460 480 452 560 420 C640 388 680 380 790 380" fill="none" stroke="#113163" stroke-width="3">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.35;0.55;0.9;1" dur="8s" repeatCount="indefinite"/>
  </path>
  <!-- sharp average: visible once the RMS band tightens -->
  <path d="M330 460 L546 460 C558 460 554 380 574 380 L790 380" fill="none" stroke="#113163" stroke-width="3">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.55;0.9;1" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- status line -->
  <text x="450" y="505" text-anchor="middle" font-size="16" fill="#5a6472">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.35;0.55;0.9;1" dur="8s" repeatCount="indefinite"/>
    Edges scatter around the ideal instant, so the averaged edge smears.
  </text>
  <text x="450" y="505" text-anchor="middle" font-size="16" fill="#0655a3">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.55;0.9;1" dur="8s" repeatCount="indefinite"/>
    The RMS band tightens, and the same average sharpens into a clean edge.
  </text>
</svg>
