<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#f5f7fa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#113163">The rotating phasor and its I/Q projections</text>

  <!-- complex plane -->
  <line x1="50" y1="262" x2="330" y2="262" stroke="#d8dde4" stroke-width="2"/>
  <line x1="190" y1="122" x2="190" y2="402" stroke="#d8dde4" stroke-width="2"/>
  <circle cx="190" cy="262" r="100" fill="none" stroke="#d8dde4" stroke-width="2"/>
  <text x="336" y="267" font-size="15" fill="#5a6472">I (real)</text>
  <text x="182" y="114" text-anchor="end" font-size="15" fill="#5a6472">Q (imag)</text>
  <text x="190" y="430" text-anchor="middle" font-size="15" fill="#5a6472">e^(j2&#960;ft) turns counterclockwise</text>

  <!-- dashed projection connectors (animated endpoints) -->
  <line x1="290" y1="262" x2="360" y2="92" stroke="#37b6f0" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.75">
    <animate attributeName="x1" dur="6s" repeatCount="indefinite" values="290.0;286.6;276.6;260.7;240.0;215.9;190.0;164.1;140.0;119.3;103.4;93.4;90.0;93.4;103.4;119.3;140.0;164.1;190.0;215.9;240.0;260.7;276.6;286.6;290.0"/>
    <animate attributeName="y1" dur="6s" repeatCount="indefinite" values="262.0;236.1;212.0;191.3;175.4;165.4;162.0;165.4;175.4;191.3;212.0;236.1;262.0;287.9;312.0;332.7;348.6;358.6;362.0;358.6;348.6;332.7;312.0;287.9;262.0"/>
    <animate attributeName="y2" dur="6s" repeatCount="indefinite" values="92.0;94.0;99.8;109.0;121.0;135.0;150.0;165.0;179.0;191.0;200.2;206.0;208.0;206.0;200.2;191.0;179.0;165.0;150.0;135.0;121.0;109.0;99.8;94.0;92.0"/>
  </line>
  <line x1="290" y1="262" x2="360" y2="392" stroke="#c77e00" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.75">
    <animate attributeName="x1" dur="6s" repeatCount="indefinite" values="290.0;286.6;276.6;260.7;240.0;215.9;190.0;164.1;140.0;119.3;103.4;93.4;90.0;93.4;103.4;119.3;140.0;164.1;190.0;215.9;240.0;260.7;276.6;286.6;290.0"/>
    <animate attributeName="y1" dur="6s" repeatCount="indefinite" values="262.0;236.1;212.0;191.3;175.4;165.4;162.0;165.4;175.4;191.3;212.0;236.1;262.0;287.9;312.0;332.7;348.6;358.6;362.0;358.6;348.6;332.7;312.0;287.9;262.0"/>
    <animate attributeName="y2" dur="6s" repeatCount="indefinite" values="392.0;377.0;363.0;351.0;341.8;336.0;334.0;336.0;341.8;351.0;363.0;377.0;392.0;407.0;421.0;433.0;442.2;448.0;450.0;448.0;442.2;433.0;421.0;407.0;392.0"/>
  </line>

  <!-- rotating phasor -->
  <g>
    <line x1="190" y1="262" x2="290" y2="262" stroke="#113163" stroke-width="4" stroke-linecap="round"/>
    <circle cx="290" cy="262" r="8" fill="#0655a3"/>
    <animateTransform attributeName="transform" type="rotate" dur="6s" repeatCount="indefinite" values="0 190 262; -360 190 262"/>
  </g>
  <circle cx="190" cy="262" r="4" fill="#113163"/>

