      <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" values="0,0; 150.0,0"/>
    </g>
  </g>
  <circle cx="360" cy="392" r="7" fill="#c77e00">
    <animate attributeName="cy" dur="6s" repeatCount="indefinite" values="392.0;377.0;363.0;351.0;341.8;336.0;334.0;336.0;341.8;351.0;363.0;377.0;392.0;407.0;421.0;433.0;442.2;448.0;450.0;448.0;442.2;433.0;421.0;407.0;392.0"/>
  </circle>
  <text x="360" y="310" font-size="16" font-weight="bold" fill="#c77e00">Q(t) = A sin(2&#960;ft)</text>

  <!-- 90-degree note -->
  <text x="610.0" y="277.0" text-anchor="middle" font-size="16" fill="#5a6472">Q lags I by 90&#176;: same wave, a quarter turn later</text>
  <text x="610.0" y="502" text-anchor="middle" font-size="14" fill="#5a6472">One full rotation of the phasor = one full cycle of both waveforms</text>
</svg>
