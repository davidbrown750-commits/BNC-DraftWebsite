  <clipPath id="clipI"><rect x="360" y="78" width="500" height="144"/></clipPath>
  <line x1="360" y1="150" x2="860" y2="150" stroke="#d8dde4" stroke-width="2"/>
  <g clip-path="url(#clipI)">
