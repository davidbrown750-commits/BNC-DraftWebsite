      <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" values="0,0; 150.0,0"/>
    </g>
  </g>
  <circle cx="360" cy="92" r="7" fill="#37b6f0">
    <animate attributeName="cy" dur="6s" repeatCount="indefinite" values="92.0;94.0;99.8;109.0;121.0;135.0;150.0;165.0;179.0;191.0;200.2;206.0;208.0;206.0;200.2;191.0;179.0;165.0;150.0;135.0;121.0;109.0;99.8;94.0;92.0"/>
  </circle>
  <text x="360" y="68" font-size="16" font-weight="bold" fill="#0655a3">I(t) = A cos(2&#960;ft)</text>

  <!-- Q waveform panel -->
  <clipPath id="clipQ"><rect x="360" y="320" width="500" height="144"/></clipPath>
  <line x1="360" y1="392" x2="860" y2="392" stroke="#d8dde4" stroke-width="2"/>
  <g clip-path="url(#clipQ)">
    <g>
