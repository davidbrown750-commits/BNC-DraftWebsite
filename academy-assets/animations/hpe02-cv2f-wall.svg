<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="barfill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0655a3"/>
      <stop offset="1" stop-color="#37b6f0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#f5f7fa"/>
  <text x="450" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#113163">The C&#183;V&#178;&#183;f wall</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#5a6472">Every pulse charges and discharges the load capacitance. Average power climbs with repetition rate.</text>

  <!-- pulse train, rep rate increasing left to right -->
  <path d="M 60.0 158.0 L 60.0 158.0 L 60.0 104.0 L 86.0 104.0 L 86.0 158.0 L 122.0 158.0 L 122.0 104.0 L 144.4 104.0 L 144.4 158.0 L 175.3 158.0 L 175.3 104.0 L 194.6 104.0 L 194.6 158.0 L 221.2 158.0 L 221.2 104.0 L 237.7 104.0 L 237.7 158.0 L 260.6 158.0 L 260.6 104.0 L 274.9 104.0 L 274.9 158.0 L 294.5 158.0 L 294.5 104.0 L 306.8 104.0 L 306.8 158.0 L 323.7 158.0 L 323.7 104.0 L 334.2 104.0 L 334.2 158.0 L 348.8 158.0 L 348.8 104.0 L 357.8 104.0 L 357.8 158.0 L 370.3 158.0 L 370.3 104.0 L 378.1 104.0 L 378.1 158.0 L 388.9 158.0 L 388.9 104.0 L 395.6 104.0 L 395.6 158.0 L 404.9 158.0 L 404.9 104.0 L 410.6 104.0 L 410.6 158.0 L 418.6 158.0 L 418.6 104.0 L 423.5 104.0 L 423.5 158.0 L 430.4 158.0 L 430.4 104.0 L 434.6 104.0 L 434.6 158.0 L 440.5 158.0 L 440.5 104.0 L 444.2 104.0 L 444.2 158.0 L 449.2 158.0 L 449.2 104.0 L 452.4 104.0 L 452.4 158.0 L 540.0 158.0" fill="none" stroke="#0655a3" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="60.0" y1="158.0" x2="540.0" y2="158.0" stroke="#d8dde4" stroke-width="1"/>
  <text x="60.0" y="182" font-size="13" fill="#5a6472">repetition rate f increasing &#8594;</text>
  <line x1="60.0" y1="92" x2="60.0" y2="168" stroke="#37b6f0" stroke-width="2.5" opacity="0.9">
    <animate attributeName="x1" values="60.0;452.4" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="60.0;452.4" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- circuit: pulser into a capacitive load -->
  <rect x="52" y="272" width="132" height="92" rx="9" fill="#113163"/>
  <text x="118" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">HV pulser</text>
  <text x="118" y="334" text-anchor="middle" font-size="12" fill="#c4d6ee">voltage output</text>
  <line x1="184" y1="318" x2="336" y2="318" stroke="#5a6472" stroke-width="3"/>
  <line x1="340" y1="278" x2="340" y2="358" stroke="#113163" stroke-width="6"/>
  <line x1="362" y1="278" x2="362" y2="358" stroke="#113163" stroke-width="6"/>
  <rect x="345" y="282" width="12" height="72" fill="#37b6f0" opacity="0">
    <animate attributeName="opacity" values="0;0.95;0;0;0.95;0;0;0.95;0;0;0.95;0;0;0.95;0;0;0.95;0;0;0.95;0;0;0.95;0;0;0.95;0;0;0.95;0;0;0.95;0;0;0.95;0;0;0.95;0;0;0.95;0;0;0.95;0" keyTimes="0.0000;0.0299;0.0664;0.1580;0.1837;0.2151;0.2939;0.3160;0.3430;0.4107;0.4297;0.4530;0.5112;0.5276;0.5475;0.5977;0.6117;0.6289;0.6720;0.6841;0.6988;0.7359;0.7463;0.7590;0.7909;0.7998;0.8107;0.8382;0.8459;0.8552;0.8788;0.8854;0.8935;0.9138;0.9195;0.9264;0.9439;0.9488;0.9547;0.9697;0.9739;0.9791;0.9920;0.9956;1.0000" dur="8s" repeatCount="indefinite"/>
  </rect>
  <line x1="366" y1="318" x2="430" y2="318" stroke="#5a6472" stroke-width="3"/>
  <line x1="430" y1="318" x2="430" y2="344" stroke="#5a6472" stroke-width="3"/>
  <line x1="412" y1="344" x2="448" y2="344" stroke="#5a6472" stroke-width="3"/>
  <line x1="419" y1="352" x2="441" y2="352" stroke="#5a6472" stroke-width="3"/>
  <line x1="426" y1="360" x2="434" y2="360" stroke="#5a6472" stroke-width="3"/>
  <text x="382" y="266" font-size="15" font-weight="bold" fill="#113163">C</text>
  <text x="255" y="398" text-anchor="middle" font-size="13" fill="#5a6472">Capacitive load (Pockels cell, deflection plates, grid):</text>
  <text x="255" y="416" text-anchor="middle" font-size="13" fill="#5a6472">charged on every rising edge, dumped on every falling edge</text>
  <text x="255" y="452" text-anchor="middle" font-size="15" font-weight="bold" fill="#0655a3">I = C&#183;dV/dt on each edge</text>

  <!-- power bar vs repetition rate -->
  <line x1="640" y1="130" x2="640" y2="460" stroke="#5a6472" stroke-width="2"/>
  <line x1="640" y1="460" x2="866" y2="460" stroke="#5a6472" stroke-width="2"/>
  <text x="618" y="300" font-size="13" fill="#5a6472" transform="rotate(-90 618 300)" text-anchor="middle">average power dissipated</text>
  <text x="753" y="484" text-anchor="middle" font-size="13" fill="#5a6472">repetition rate f &#8594;</text>
  <line x1="640" y1="190" x2="866" y2="190" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="753" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">thermal limit (max average dissipation)</text>
  <rect x="712" width="82" fill="url(#barfill)" y="460" height="0">
    <animate attributeName="y" values="451.9;435.7;411.4;370.9;319.6;257.5;211.6;190.0" keyTimes="0.000;0.200;0.400;0.600;0.750;0.870;0.950;1.000" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="height" values="8.1;24.3;48.6;89.1;140.4;202.5;248.4;270.0" keyTimes="0.000;0.200;0.400;0.600;0.750;0.870;0.950;1.000" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="712" y="190" width="82" height="7" fill="#c0392b" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.94;0.965;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="753" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b" opacity="0">limit reached: f capped
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.94;0.965;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="753" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#113163">P = C&#183;V&#178;&#183;f</text>
</svg>
