<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#113163">Electroporation: a pulsed field opens pores in a cell membrane</text>

  <!-- ================= LEFT PANEL: REVERSIBLE ================= -->
  <text x="235" y="70" text-anchor="middle" font-size="17" font-weight="bold" fill="#0655a3">Reversible electroporation</text>

  <!-- electrode plates -->
  <rect x="66" y="140" width="10" height="180" rx="2" fill="#113163"/>
  <rect x="394" y="140" width="10" height="180" rx="2" fill="#113163"/>

  <!-- field arrows (visible during the pulse) -->
  <g stroke="#37b6f0" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.10;0.12;0.18;0.22;1" dur="10s" repeatCount="indefinite"/>
    <line x1="84" y1="168" x2="130" y2="168"/><polygon points="130,163 140,168 130,173" fill="#37b6f0" stroke="none"/>
    <line x1="84" y1="230" x2="130" y2="230"/><polygon points="130,225 140,230 130,235" fill="#37b6f0" stroke="none"/>
    <line x1="84" y1="292" x2="130" y2="292"/><polygon points="130,287 140,292 130,297" fill="#37b6f0" stroke="none"/>
    <line x1="340" y1="168" x2="376" y2="168"/><polygon points="376,163 386,168 376,173" fill="#37b6f0" stroke="none"/>
    <line x1="340" y1="230" x2="376" y2="230"/><polygon points="376,225 386,230 376,235" fill="#37b6f0" stroke="none"/>
    <line x1="340" y1="292" x2="376" y2="292"/><polygon points="376,287 386,292 376,297" fill="#37b6f0" stroke="none"/>
    <text x="112" y="152" font-size="14" fill="#0655a3" stroke="none">E field</text>
  </g>

  <!-- cell -->
  <circle cx="235" cy="230" r="78" fill="#d9f0fc" stroke="#113163" stroke-width="6"/>
  <circle cx="235" cy="230" r="24" fill="#9fd3f2" stroke="#0655a3" stroke-width="2"/>

  <!-- pores: open during the pulse, reseal after -->
  <g fill="#ffffff" stroke="#0655a3" stroke-width="2">
    <circle cx="313" cy="230" r="0"><animate attributeName="r" values="0;0;7;7;0;0" keyTimes="0;0.10;0.20;0.35;0.50;1" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="274" cy="297.5" r="0"><animate attributeName="r" values="0;0;7;7;0;0" keyTimes="0;0.11;0.21;0.35;0.50;1" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="196" cy="297.5" r="0"><animate attributeName="r" values="0;0;7;7;0;0" keyTimes="0;0.10;0.21;0.36;0.51;1" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="157" cy="230" r="0"><animate attributeName="r" values="0;0;7;7;0;0" keyTimes="0;0.11;0.20;0.34;0.49;1" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="196" cy="162.5" r="0"><animate attributeName="r" values="0;0;7;7;0;0" keyTimes="0;0.10;0.20;0.36;0.50;1" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="274" cy="162.5" r="0"><animate attributeName="r" values="0;0;7;7;0;0" keyTimes="0;0.11;0.21;0.34;0.50;1" dur="10s" repeatCount="indefinite"/></circle>
  </g>

  <!-- outcome label -->
  <text x="235" y="348" text-anchor="middle" font-size="16" font-weight="bold" fill="#0655a3" opacity="0">
    Pores reseal: the cell recovers
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.62;0.95;1" dur="10s" repeatCount="indefinite"/>
  </text>

  <!-- pulse trace: one short pulse -->
  <polyline points="70,440 103,440 103,405 129,405 129,440 400,440" fill="none" stroke="#5a6472" stroke-width="2.5"/>
  <line x1="70" y1="378" x2="70" y2="455" stroke="#d8dde4" stroke-width="1"/>
  <line x1="70" y1="380" x2="70" y2="456" stroke="#37b6f0" stroke-width="2">
    <animate attributeName="x1" values="70;400" keyTimes="0;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="70;400" keyTimes="0;1" dur="10s" repeatCount="indefinite"/>
  </line>
  <text x="235" y="478" text-anchor="middle" font-size="15" fill="#5a6472">One short pulse</text>

  <!-- ================= RIGHT PANEL: IRE ================= -->
  <text x="665" y="70" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">Irreversible electroporation (IRE)</text>

  <!-- electrode plates -->
  <rect x="496" y="140" width="10" height="180" rx="2" fill="#113163"/>
  <rect x="824" y="140" width="10" height="180" rx="2" fill="#113163"/>

  <!-- field arrows (visible through the train, stronger) -->
  <g stroke="#0655a3" stroke-width="4" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.10;0.12;0.45;0.50;1" dur="10s" repeatCount="indefinite"/>
    <line x1="514" y1="168" x2="560" y2="168"/><polygon points="560,162 571,168 560,174" fill="#0655a3" stroke="none"/>
    <line x1="514" y1="230" x2="560" y2="230"/><polygon points="560,224 571,230 560,236" fill="#0655a3" stroke="none"/>
    <line x1="514" y1="292" x2="560" y2="292"/><polygon points="560,286 571,292 560,298" fill="#0655a3" stroke="none"/>
    <line x1="770" y1="168" x2="806" y2="168"/><polygon points="806,162 817,168 806,174" fill="#0655a3" stroke="none"/>
    <line x1="770" y1="230" x2="806" y2="230"/><polygon points="806,224 817,230 806,236" fill="#0655a3" stroke="none"/>
    <line x1="770" y1="292" x2="806" y2="292"/><polygon points="806,286 817,292 806,298" fill="#0655a3" stroke="none"/>
    <text x="540" y="152" font-size="14" fill="#0655a3" stroke="none">stronger E field</text>
  </g>

  <!-- cell: interior fades as contents leak -->
  <circle cx="665" cy="230" r="78" stroke="#113163" stroke-width="6" fill="#d9f0fc">
    <animate attributeName="fill" values="#d9f0fc;#d9f0fc;#e6e9ec;#e6e9ec" keyTimes="0;0.30;0.70;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="665" cy="230" r="24" fill="#9fd3f2" stroke="#0655a3" stroke-width="2">
    <animate attributeName="opacity" values="1;1;0.35;0.35" keyTimes="0;0.30;0.75;1" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- pores: open and stay open -->
  <g fill="#ffffff" stroke="#c0392b" stroke-width="2">
    <circle cx="743" cy="230" r="0"><animate attributeName="r" values="0;0;9;9;9;0" keyTimes="0;0.12;0.25;0.60;0.96;1" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="704" cy="297.5" r="0"><animate attributeName="r" values="0;0;9;9;9;0" keyTimes="0;0.13;0.26;0.60;0.96;1" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="626" cy="297.5" r="0"><animate attributeName="r" values="0;0;9;9;9;0" keyTimes="0;0.12;0.26;0.60;0.96;1" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="587" cy="230" r="0"><animate attributeName="r" values="0;0;9;9;9;0" keyTimes="0;0.13;0.25;0.60;0.96;1" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="626" cy="162.5" r="0"><animate attributeName="r" values="0;0;9;9;9;0" keyTimes="0;0.12;0.25;0.60;0.96;1" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="704" cy="162.5" r="0"><animate attributeName="r" values="0;0;9;9;9;0" keyTimes="0;0.13;0.26;0.60;0.96;1" dur="10s" repeatCount="indefinite"/></circle>
  </g>

  <!-- leaking contents -->
  <g fill="#37b6f0">
    <circle r="4" opacity="0">
      <animate attributeName="cx" values="743;743;780;800" keyTimes="0;0.30;0.55;0.80" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;230;222;216" keyTimes="0;0.30;0.55;0.80" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.30;0.42;0.78;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" opacity="0">
      <animate attributeName="cx" values="704;704;728;746" keyTimes="0;0.34;0.58;0.84" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="297.5;297.5;322;340" keyTimes="0;0.34;0.58;0.84" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.34;0.46;0.82;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" opacity="0">
      <animate attributeName="cx" values="626;626;600;582" keyTimes="0;0.38;0.62;0.88" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="162.5;162.5;140;124" keyTimes="0;0.38;0.62;0.88" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.38;0.50;0.86;1" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- outcome label -->
  <text x="665" y="348" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b" opacity="0">
    Pores stay open: apoptosis
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.62;0.95;1" dur="10s" repeatCount="indefinite"/>
  </text>

  <!-- pulse trace: longer, stronger train -->
  <polyline points="500,440 533,440 533,392 545,392 545,440 556,440 556,392 568,392 568,440 579,440 579,392 591,392 591,440 602,440 602,392 614,392 614,440 625,440 625,392 637,392 637,440 830,440" fill="none" stroke="#5a6472" stroke-width="2.5"/>
  <line x1="500" y1="378" x2="500" y2="455" stroke="#d8dde4" stroke-width="1"/>
  <line x1="500" y1="380" x2="500" y2="456" stroke="#0655a3" stroke-width="2">
    <animate attributeName="x1" values="500;830" keyTimes="0;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="500;830" keyTimes="0;1" dur="10s" repeatCount="indefinite"/>
  </line>
  <text x="665" y="478" text-anchor="middle" font-size="15" fill="#5a6472">Longer, stronger pulse train</text>

  <!-- footer note -->
  <text x="450" y="508" text-anchor="middle" font-size="14" fill="#5a6472">Below the field threshold the membrane reseals; above it, the channels never close.</text>
</svg>
