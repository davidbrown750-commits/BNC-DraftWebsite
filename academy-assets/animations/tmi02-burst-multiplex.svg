<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <text x="450" y="40" text-anchor="middle" font-size="21" font-weight="bold" fill="#113163">One trigger, two counted bursts, one multiplexed output</text>

  <!-- Trigger row -->
  <text x="130" y="110" text-anchor="end" font-size="16" font-weight="bold" fill="#113163">Trigger</text>
  <line x1="140" y1="105" x2="520" y2="105" stroke="#5a6472" stroke-width="1.5"/>
  <g>
    <rect x="158" y="75" width="14" height="30" fill="#113163" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.04;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="165" y="68" text-anchor="middle" font-size="13" fill="#5a6472" opacity="0">T0
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.04;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Channel rows -->
  <text x="130" y="190" text-anchor="end" font-size="16" font-weight="bold" fill="#0655a3">CH1 &#183; burst of 3</text>
  <line x1="140" y1="185" x2="520" y2="185" stroke="#d8dde4" stroke-width="1.5"/>

  <text x="130" y="270" text-anchor="end" font-size="16" font-weight="bold" fill="#37b6f0">CH2 &#183; burst of 3</text>
  <line x1="140" y1="265" x2="520" y2="265" stroke="#d8dde4" stroke-width="1.5"/>

  <!-- CH1 pulses (slots 1, 3, 5) -->
  <rect x="200" y="151" width="30" height="34" fill="#0655a3" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.12;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="306" y="151" width="30" height="34" fill="#0655a3" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.24;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="412" y="151" width="30" height="34" fill="#0655a3" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.36;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- CH2 pulses (slots 2, 4, 6) -->
  <rect x="253" y="231" width="30" height="34" fill="#37b6f0" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.18;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="359" y="231" width="30" height="34" fill="#37b6f0" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.30;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="465" y="231" width="30" height="34" fill="#37b6f0" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.42;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- MUX marker -->
  <line x1="330" y1="300" x2="330" y2="348" stroke="#5a6472" stroke-width="2"/>
  <polygon points="330,358 324,346 336,346" fill="#5a6472"/>
  <text x="345" y="332" font-size="16" font-weight="bold" fill="#5a6472">MUX</text>

  <!-- Output row -->
  <text x="130" y="405" text-anchor="end" font-size="16" font-weight="bold" fill="#113163">MUX out</text>
  <line x1="140" y1="400" x2="520" y2="400" stroke="#5a6472" stroke-width="1.5"/>

  <!-- Moving pulses: CH1 copies drop 215, CH2 copies drop 135 -->
  <rect x="200" y="151" width="30" height="34" fill="#0655a3" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.14;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 215;0 215" keyTimes="0;0.14;0.19;1" calcMode="linear" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="253" y="231" width="30" height="34" fill="#37b6f0" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.20;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 135;0 135" keyTimes="0;0.20;0.25;1" calcMode="linear" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="306" y="151" width="30" height="34" fill="#0655a3" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.26;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 215;0 215" keyTimes="0;0.26;0.31;1" calcMode="linear" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="359" y="231" width="30" height="34" fill="#37b6f0" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.32;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 135;0 135" keyTimes="0;0.32;0.37;1" calcMode="linear" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="412" y="151" width="30" height="34" fill="#0655a3" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.38;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 215;0 215" keyTimes="0;0.38;0.43;1" calcMode="linear" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="465" y="231" width="30" height="34" fill="#37b6f0" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.44;0.92" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 135;0 135" keyTimes="0;0.44;0.49;1" calcMode="linear" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Shot counter panel -->
  <rect x="580" y="120" width="270" height="210" rx="10" fill="#f5f7fa" stroke="#d8dde4" stroke-width="1.5"/>
  <text x="715" y="158" text-anchor="middle" font-size="17" font-weight="bold" fill="#113163" letter-spacing="2">SHOT COUNTER</text>
  <g text-anchor="middle" font-size="68" font-weight="bold" fill="#0655a3">
    <text x="715" y="250" opacity="1">0
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.19;0.97" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="715" y="250" opacity="0">1
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.19;0.25" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="715" y="250" opacity="0">2
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.31" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="715" y="250" opacity="0">3
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.31;0.37" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="715" y="250" opacity="0">4
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.37;0.43" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="715" y="250" opacity="0">5
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.43;0.49" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="715" y="250" opacity="0">6
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.49;0.97" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="715" y="295" text-anchor="middle" font-size="14" fill="#5a6472">pulses delivered</text>

  <!-- Caption -->
  <text x="450" y="470" text-anchor="middle" font-size="15" fill="#5a6472">One trigger releases a counted burst on each channel; the multiplexer interleaves</text>
  <text x="450" y="492" text-anchor="middle" font-size="15" fill="#5a6472">them onto one connector while the shot counter tallies every pulse.</text>
</svg>
